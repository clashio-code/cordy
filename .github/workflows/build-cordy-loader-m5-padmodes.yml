          /* --dump MOD:VADDRHEX:LENHEX  -> cetak byte kode modul (setelah relokasi) untuk dianalisis offline */
          typedef struct { char mod[16]; uint32_t v, len; } DumpReq;
          static DumpReq dumps[12]; static int ndump;
          static uint32_t phex(const char **p) {
            uint32_t v = 0; const char *s = *p;
            for (;; s++) {
              if (*s >= '0' && *s <= '9') v = v * 16 + (uint32_t)(*s - '0');
              else if (*s >= 'a' && *s <= 'f') v = v * 16 + (uint32_t)(*s - 'a' + 10);
              else if (*s >= 'A' && *s <= 'F') v = v * 16 + (uint32_t)(*s - 'A' + 10);
              else break;
            }
            *p = s; return v;
          }
          static void add_dump(const char *spec) {
            DumpReq *d; const char *p = spec; size_t n = 0;
            if (ndump >= 12) return;
            d = &dumps[ndump];
            while (*p && *p != ':' && n < sizeof d->mod - 1) d->mod[n++] = *p++;
            d->mod[n] = 0;
            if (*p != ':') return;
            p++; d->v = phex(&p);
            if (*p != ':') return;
            p++; d->len = phex(&p);
            ndump++;
          }
