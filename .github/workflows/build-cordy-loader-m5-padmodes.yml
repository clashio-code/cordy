            if (argc > 1 && argv[1][0] != '-') dir = argv[1];
            for (i = 1; i < argc; i++) {
              if (!strcmp(argv[i], "--dry")) stage = 0;
              else if (!strcmp(argv[i], "--stage") && i + 1 < argc) stage = pint(argv[++i]);
              else if (!strcmp(argv[i], "--apk") && i + 1 < argc) apk = argv[++i];
              else if (!strcmp(argv[i], "--timeout") && i + 1 < argc) timeout = pint(argv[++i]);
              else if (!strcmp(argv[i], "--frames") && i + 1 < argc) frames = pint(argv[++i]);
              else if (!strcmp(argv[i], "--ninit") && i + 2 < argc) { nina = pint(argv[++i]); ninb = pint(argv[++i]); }
              else if (!strcmp(argv[i], "--log") && i + 1 < argc) logf = argv[++i];
          else if (!strcmp(argv[i], "--padmode") && i + 1 < argc) g_padmode = !strcmp(argv[++i], "controller");
              else if (!strcmp(argv[i], "--dump") && i + 1 < argc) add_dump(argv[++i]);
            }
            g_log = fopen(logf, "w");
