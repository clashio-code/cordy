              Mod *m = NULL; int k; uint32_t a;
              for (k = 0; k < nmods; k++) if (strstr(mods[k].name, dumps[i].mod)) m = &mods[k];
              if (!m) { L("[dump] modul %s tidak ada\n", dumps[i].mod); continue; }
              if (dumps[i].v + dumps[i].len > m->minv + m->span) { L("[dump] range di luar modul\n"); continue; }
              L("[dump] %s vaddr 0x%x len 0x%x\n", m->name, dumps[i].v, dumps[i].len);
              for (a = dumps[i].v; a < dumps[i].v + dumps[i].len; a += 16) {
                uint32_t j; L("  kode %06x:", a);
                for (j = 0; j < 16 && a + j < dumps[i].v + dumps[i].len; j++) L(" %02x", ((uint8_t *)(m->bias + a))[j]);
                L("\n");
              }
            }
          }

          /* ======================= main ======================= */
          static void *try_open(const char *label, const char *const *paths) {
            int i; void *h = NULL;
            for (i = 0; paths[i] && !h; i++) h = dlopen(paths[i], RTLD_NOW | RTLD_GLOBAL);
            L("  %-14s: %s\n", label, h ? "OK" : "TIDAK ADA");
            return h;
          }
          static void run_ctors(Mod *m) {
            uint32_t i;
            L("[ctor] %s: DT_INIT=%s init_array=%u entri\n", m->name, m->init ? "ada" : "tidak ada", m->niarr);
            if (m->init) { void (*f)(void) = (void (*)(void))(m->bias + m->init); f(); }
            for (i = 0; i < m->niarr; i++) {
              uint32_t v = m->iarr[i]; void (*f)(void);
              if (v == 0 || v == 0xFFFFFFFFu) continue;
              f = (void (*)(void))PTR(v);
              { char d[200]; describe((uintptr_t)f & ~1u, d, sizeof d); L("[ctor] %s #%u -> %p  %s\n", m->name, i, (void *)f, d); }
              f();
            }
            L("[ctor] %s selesai\n", m->name);
          }

          /* ======================= STAGE 3: SDL2 + konteks GLES2 + loop Unity ======================= */
          static void *sdl_h, *g_win, *g_ctx;
          static int (*p_SDL_Init)(uint32_t);
          static const char *(*p_SDL_GetError)(void);
          static int (*p_SDL_GL_SetAttribute)(int, int);
          static void *(*p_SDL_CreateWindow)(const char *, int, int, int, int, uint32_t);
          static void *(*p_SDL_GL_CreateContext)(void *);
          static void (*p_SDL_GL_SwapWindow)(void *);
          static void (*p_SDL_GL_GetDrawableSize)(void *, int *, int *);
          static int (*p_SDL_GL_SetSwapInterval)(int);
          static int (*p_SDL_PollEvent)(void *);
          static const char *(*p_SDL_GetCurrentVideoDriver)(void);
          static int (*p_SDL_InitSubSystem)(uint32_t);
          static int (*p_SDL_NumJoysticks)(void);
          static void *(*p_SDL_JoystickOpen)(int);
          static const char *(*p_SDL_JoystickName)(void *);
          static int (*p_SDL_IsGameController)(int);
          static void *(*p_SDL_GameControllerOpen)(int);
          static const unsigned char *(*p_glGetString)(unsigned);
          static unsigned (*p_glGetError)(void);
          static void (*p_glEnable)(unsigned), (*p_glDisable)(unsigned), (*p_glScissor)(int, int, int, int);
          static void (*p_glClearColor)(float, float, float, float), (*p_glClear)(unsigned);
          static void (*p_glGetIntegerv)(unsigned, int *), (*p_glGetFloatv)(unsigned, float *);
          static unsigned char (*p_glIsEnabled)(unsigned);
          static int g_sw = 640, g_sh = 480;

          static void *glfn(const char *n) {
            void *p = NULL;
            if (h_gl2 && (p = dlsym(h_gl2, n))) return p;
            if (h_mali && (p = dlsym(h_mali, n))) return p;
            if (h_gl1) p = dlsym(h_gl1, n);
            return p;
          }

          static int gl_init(int *w, int *h) {
            static const char *libs[] = { "libSDL2-2.0.so.0", "/usr/lib32/libSDL2-2.0.so.0", "libSDL2.so", NULL };
            int i, ww = 0, hh = 0;
            for (i = 0; libs[i] && !sdl_h; i++) { sdl_h = dlopen(libs[i], RTLD_NOW | RTLD_GLOBAL); L("[sdl] dlopen %s : %s\n", libs[i], sdl_h ? "OK" : dlerror()); }
            if (!sdl_h) return -1;
          #define SYM(n) do { *(void **)&p_##n = dlsym(sdl_h, #n); if (!p_##n) { L("[sdl] simbol %s tidak ada\n", #n); return -1; } } while (0)
            SYM(SDL_Init); SYM(SDL_GetError); SYM(SDL_GL_SetAttribute); SYM(SDL_CreateWindow); SYM(SDL_GL_CreateContext);
            SYM(SDL_GL_SwapWindow); SYM(SDL_GL_GetDrawableSize); SYM(SDL_GL_SetSwapInterval); SYM(SDL_PollEvent); SYM(SDL_GetCurrentVideoDriver);
          #undef SYM
            if (p_SDL_Init(0x00000020u) != 0) { L("[sdl] SDL_Init(VIDEO) gagal: %s\n", p_SDL_GetError()); return -1; }
            L("[sdl] video driver: %s\n", p_SDL_GetCurrentVideoDriver() ? p_SDL_GetCurrentVideoDriver() : "?");
            p_SDL_GL_SetAttribute(17, 2);  /* CONTEXT_MAJOR_VERSION = 2 (settings.xml: gles_mode=2) */
            p_SDL_GL_SetAttribute(18, 0);
            p_SDL_GL_SetAttribute(21, 4);  /* PROFILE_MASK = ES */
            p_SDL_GL_SetAttribute(0, 8); p_SDL_GL_SetAttribute(1, 8); p_SDL_GL_SetAttribute(2, 8); p_SDL_GL_SetAttribute(3, 0);
            p_SDL_GL_SetAttribute(5, 1); p_SDL_GL_SetAttribute(6, 16); p_SDL_GL_SetAttribute(7, 8);
            g_win = p_SDL_CreateWindow("Cordy", 0x1FFF0000, 0x1FFF0000, 640, 480, 0x00000002u | 0x00001001u);
            if (!g_win) { L("[sdl] SDL_CreateWindow gagal: %s\n", p_SDL_GetError()); return -1; }
            g_ctx = p_SDL_GL_CreateContext(g_win);
            if (!g_ctx) { L("[sdl] SDL_GL_CreateContext (GLES2) gagal: %s\n", p_SDL_GetError()); return -1; }
            p_SDL_GL_SetSwapInterval(1);
            p_SDL_GL_GetDrawableSize(g_win, &ww, &hh);
            *w = ww > 0 ? ww : 640; *h = hh > 0 ? hh : 480;
            *(void **)&p_glGetString = glfn("glGetString"); *(void **)&p_glGetError = glfn("glGetError");
            if (p_glGetString) {
              L("[gl] VENDOR   : %s\n", (const char *)p_glGetString(0x1F00));
              L("[gl] RENDERER : %s\n", (const char *)p_glGetString(0x1F01));
              L("[gl] VERSION  : %s\n", (const char *)p_glGetString(0x1F02));
              L("[gl] EXTENSIONS: %.700s\n", (const char *)p_glGetString(0x1F03));
            }
            L("[gl] ukuran drawable: %dx%d\n", *w, *h);
            return 0;
          }

          /* ---- panggilan native UnityPlayer ---- */
          typedef void (*fn_v_t)(void *, void *);
          typedef int (*fn_r_t)(void *, void *);
          typedef void (*fn_i_t)(void *, void *, int);
          typedef void (*fn_ii_t)(void *, void *, int, int);
          typedef void (*fn_iiii_t)(void *, void *, int, int, int, int);
          typedef void (*fn_p_t)(void *, void *, void *);
          typedef void (*fn_pp_t)(void *, void *, void *, void *);
          typedef void (AAPCS *fn_touch_t)(void *, void *, int, float, float, int, int64_t, int);
          static void *nf(const char *name) { int i; for (i = 0; i < nnat; i++) if (!strcmp(nats[i].name, name)) return nats[i].fn; L("[native] %s TIDAK terdaftar\n", name); return NULL; }
          static void *g_nenv, *g_nobj;
          static fn_touch_t g_ntouch;
          static int64_t now_ms(void) { struct timespec ts; clock_gettime(CLOCK_MONOTONIC, &ts); return (int64_t)ts.tv_sec * 1000 + ts.tv_nsec / 1000000; }

          /* ---- gamepad: 2 mode ----
           * mode 0 = KURSOR     : D-pad / stik kiri gerak kursor, A/B/X/Y = tap di posisi kursor (cara lama)
           * mode 1 = CONTROLLER : tombol fisik -> sentuhan multitouch di posisi tombol HUD Cordy (kiri/kanan/lompat/aksi/pause/topi).
           *                       Stik kanan = kursor sementara (muncul 3 dtk), R2/L2/R3/L3 = tap di kursor (untuk menu & popup).
           * Ganti mode: ketuk SELECT (tekan lalu lepas tanpa tombol lain). Select+Start tetap keluar. Pilihan terakhir disimpan di padmode.txt.
           * Posisi tombol HUD bisa diubah tanpa build ulang lewat buttons.cfg (koordinat layar 640x480, kiri-atas = 0,0). */
          #define MAXF 6
          enum { H_LEFT, H_RIGHT, H_JUMP, H_ACT, H_PAUSE, H_HAT, H_N };
          enum { SB_DPAD = 1, SB_STICK = 2, SB_A = 4, SB_B = 8, SB_X = 16, SB_Y = 32, SB_L1 = 64, SB_R1 = 128, SB_START = 256 };
          typedef struct { const char *name; float x, y; int src; } Hud;
          static Hud g_hud[H_N] = {
            { "left", 50.f, 352.f, 0 }, { "right", 137.f, 410.f, 0 }, { "jump", 582.f, 346.f, 0 },
            { "action", 508.f, 408.f, 0 }, { "pause", 597.f, 72.f, 0 }, { "hat", 597.f, 125.f, 0 } };
          static struct { int used, key; float x, y; } g_fg[MAXF];
          static int g_sel_used, g_pad_log, g_btn_back, g_btn_start, g_dp[4], g_dp_hold, g_axv[6], g_padmode;
          static int g_tapsrc, g_touch_down, g_stkl, g_stkr, g_trig[2], g_toast = 150, g_curshow, g_rs_hold;
          static float g_cx = 320.f, g_cy = 240.f;
          /* nativeTouch(int id, float x, float y, int action, long time, int SOURCE). Native Unity 3.5 hanya membalik sumbu Y (koordinat atas-kiri -> bawah-kiri)
           * dan menskala bila source == 0x1002 (SOURCE_TOUCHSCREEN); dengan source=0 ketukan jatuh di Y yang tercermin (480-y) -> "tombol tidak berfungsi". */
          #define SRC_TOUCHSCREEN 0x1002
          static int g_ntap_log;
          static void touch_ev(int id, int action, float x, float y) {
            if (g_ntap_log < 120 && action != 2) { g_ntap_log++; L("[touch] id=%d action=%d x=%.0f y=%.0f (source=0x%x)\n", id, action, (double)x, (double)y, SRC_TOUCHSCREEN); }
            if (g_ntouch) g_ntouch(g_nenv, g_nobj, id, x, y, action, now_ms(), SRC_TOUCHSCREEN);
          }
          /* kolam jari: id sentuh = slot bebas terendah (seperti pointerId Android); jari pertama = id 0 (juga dipakai emulasi mouse Unity) */
          static void ft_down(int key, float x, float y) {
            int i;
            for (i = 0; i < MAXF; i++) if (g_fg[i].used && g_fg[i].key == key) return;
            for (i = 0; i < MAXF; i++) if (!g_fg[i].used) { g_fg[i].used = 1; g_fg[i].key = key; g_fg[i].x = x; g_fg[i].y = y; touch_ev(i, 0, x, y); return; }
          }
          static void ft_move(int key, float x, float y) {
            int i;
            for (i = 0; i < MAXF; i++) if (g_fg[i].used && g_fg[i].key == key) { g_fg[i].x = x; g_fg[i].y = y; touch_ev(i, 2, x, y); return; }
          }
          static void ft_up(int key) {
            int i;
            for (i = 0; i < MAXF; i++) if (g_fg[i].used && g_fg[i].key == key) { touch_ev(i, 1, g_fg[i].x, g_fg[i].y); g_fg[i].used = 0; return; }
          }
          static void pad_init(void) {
            int i, n;
          #define OSYM(nm) (*(void **)&p_##nm = dlsym(sdl_h, #nm))
            OSYM(SDL_InitSubSystem); OSYM(SDL_NumJoysticks); OSYM(SDL_JoystickOpen); OSYM(SDL_JoystickName); OSYM(SDL_IsGameController); OSYM(SDL_GameControllerOpen);
          #undef OSYM
            *(void **)&p_glEnable = glfn("glEnable"); *(void **)&p_glDisable = glfn("glDisable"); *(void **)&p_glScissor = glfn("glScissor");
            *(void **)&p_glClearColor = glfn("glClearColor"); *(void **)&p_glClear = glfn("glClear"); *(void **)&p_glGetIntegerv = glfn("glGetIntegerv");
            *(void **)&p_glGetFloatv = glfn("glGetFloatv"); *(void **)&p_glIsEnabled = glfn("glIsEnabled");
            if (!p_SDL_InitSubSystem || p_SDL_InitSubSystem(0x00000200u | 0x00002000u) != 0) { L("[pad] init joystick/controller gagal\n"); return; }
            n = p_SDL_NumJoysticks ? p_SDL_NumJoysticks() : 0;
            L("[pad] joystick terdeteksi: %d\n", n);
            for (i = 0; i < n; i++) {
              void *j = p_SDL_JoystickOpen ? p_SDL_JoystickOpen(i) : NULL;
              int gc = p_SDL_IsGameController ? p_SDL_IsGameController(i) : 0;
              L("[pad] #%d nama=\"%s\" gamecontroller=%d\n", i, (j && p_SDL_JoystickName) ? p_SDL_JoystickName(j) : "?", gc);
              if (gc && p_SDL_GameControllerOpen) p_SDL_GameControllerOpen(i);
            }
          }
          static const char *skipnum(const char *p) {
            while (*p == ' ' || *p == '\t') p++;
            while (*p && *p != ' ' && *p != '\t' && *p != '\n' && *p != '\r') p++;
            return p;
          }
          /* buttons.cfg: satu baris per tombol, "nama x y" (nama: left right jump action pause hat), '#' = komentar. padmode.txt: pilihan mode terakhir. */
          static void pad_cfg_load(void) {
            FILE *f = fopen("buttons.cfg", "r");
            char ln[160];
            int h;
            if (!f) L("[pad] buttons.cfg tidak ada, pakai posisi bawaan\n");
            else {
              while (fgets(ln, sizeof ln, f)) {
                char *p = ln, *nm;
                while (*p == ' ' || *p == '\t') p++;
                if (*p == '#' || *p == '\n' || *p == '\r' || *p == 0) continue;
                nm = p;
                while (*p && *p != ' ' && *p != '\t') p++;
                if (!*p) continue;
                *p++ = 0;
                for (h = 0; h < H_N; h++) if (!strcmp(g_hud[h].name, nm)) { g_hud[h].x = (float)atof(p); g_hud[h].y = (float)atof(skipnum(p)); }
              }
              fclose(f);
            }
            for (h = 0; h < H_N; h++) L("[pad] HUD %-6s = (%.0f, %.0f)\n", g_hud[h].name, (double)g_hud[h].x, (double)g_hud[h].y);
            f = fopen("padmode.txt", "r");
            if (f) {
              if (fgets(ln, sizeof ln, f)) { if (!strncmp(ln, "controller", 10)) g_padmode = 1; else if (!strncmp(ln, "cursor", 6)) g_padmode = 0; }
              fclose(f);
            }
            L("[pad] mode awal: %s  (ganti: ketuk SELECT)\n", g_padmode ? "CONTROLLER" : "KURSOR");
          }
          static void hud_set(int h, int bit, int on) {
            int was = g_hud[h].src != 0;
            if (on) g_hud[h].src |= bit; else g_hud[h].src &= ~bit;
            if (!was && g_hud[h].src) ft_down(10 + h, g_hud[h].x, g_hud[h].y);
            else if (was && !g_hud[h].src) ft_up(10 + h);
          }
          static void cur_tap(int bit, int on) {
            int was = g_tapsrc != 0;
            if (on) g_tapsrc |= bit; else g_tapsrc &= ~bit;
            if (!was && g_tapsrc) { ft_down(100, g_cx, g_cy); g_touch_down = 1; }
            else if (was && !g_tapsrc) { ft_up(100); g_touch_down = 0; }
            if (on) g_curshow = 180;
          }
          static void pad_release_all(void) {
            int i;
            for (i = 0; i < MAXF; i++) if (g_fg[i].used) { touch_ev(i, 1, g_fg[i].x, g_fg[i].y); g_fg[i].used = 0; }
            for (i = 0; i < H_N; i++) g_hud[i].src = 0;
            g_tapsrc = 0; g_touch_down = 0; g_stkl = g_stkr = 0; g_trig[0] = g_trig[1] = 0;
            memset(g_dp, 0, sizeof g_dp);
          }
          static void pad_toggle(void) {
            FILE *f;
            pad_release_all();
            g_padmode = !g_padmode; g_toast = 120; g_curshow = 0;
            L("[pad] mode -> %s\n", g_padmode ? "CONTROLLER" : "KURSOR");
            f = fopen("padmode.txt", "w");
            if (f) { fputs(g_padmode ? "controller\n" : "cursor\n", f); fclose(f); }
          }
          static void pad_map(int b, int dn) {
            if (g_padmode == 0) {
              if (b >= 11 && b <= 14) g_dp[b - 11] = dn;
              else if (b >= 0 && b <= 3) cur_tap(1 << b, dn);         /* A/B/X/Y = tap di posisi kursor (game sentuh murni) */
              return;
            }
            switch (b) {
              case 13: hud_set(H_LEFT, SB_DPAD, dn); break;
              case 14: hud_set(H_RIGHT, SB_DPAD, dn); break;
              case 0: hud_set(H_JUMP, SB_A, dn); break;
              case 1: hud_set(H_ACT, SB_B, dn); break;
              case 2: hud_set(H_HAT, SB_X, dn); break;
              case 3: hud_set(H_PAUSE, SB_Y, dn); break;
              case 9: hud_set(H_ACT, SB_L1, dn); break;
              case 10: hud_set(H_JUMP, SB_R1, dn); break;
              case 6: hud_set(H_PAUSE, SB_START, dn); break;
              case 7: case 8: cur_tap(16 << (b - 7), dn); break;       /* L3/R3 = tap di kursor */
              default: break;
            }
          }
          static void cur_move(float dx, float dy, int *hold) {
            float sp;
            if (dx == 0.f && dy == 0.f) { *hold = 0; return; }
            (*hold)++;
            sp = *hold < 12 ? 3.f : *hold < 30 ? 7.f : 14.f;
            g_cx += dx * sp; g_cy += dy * sp;
            if (g_cx < 0.f) g_cx = 0.f;
            if (g_cy < 0.f) g_cy = 0.f;
            if (g_cx > (float)(g_sw - 1)) g_cx = (float)(g_sw - 1);
            if (g_cy > (float)(g_sh - 1)) g_cy = (float)(g_sh - 1);
            if (g_touch_down) ft_move(100, g_cx, g_cy);
          }
          static float stick(int v) { return (v > 8000 || v < -8000) ? (float)v / 32768.f : 0.f; }
          static void pad_tick(void) {
            if (g_padmode == 0) {
              cur_move((float)(g_dp[3] - g_dp[2]) + stick(g_axv[0]), (float)(g_dp[1] - g_dp[0]) + stick(g_axv[1]), &g_dp_hold);
              return;
            }
            /* controller: stik kiri = kiri/kanan (histeresis), stik kanan = kursor, pelatuk = tap */
            g_stkl = g_stkl ? (g_axv[0] < -8000) : (g_axv[0] < -14000);
            g_stkr = g_stkr ? (g_axv[0] > 8000) : (g_axv[0] > 14000);
            hud_set(H_LEFT, SB_STICK, g_stkl);
            hud_set(H_RIGHT, SB_STICK, g_stkr);
            { float rx = stick(g_axv[2]), ry = stick(g_axv[3]);
              if (rx != 0.f || ry != 0.f) g_curshow = 180;
              cur_move(rx, ry, &g_rs_hold); }
            { int t0 = g_axv[4] > 16000, t1 = g_axv[5] > 16000;
              if (t0 != g_trig[0]) { g_trig[0] = t0; cur_tap(1, t0); }
              if (t1 != g_trig[1]) { g_trig[1] = t1; cur_tap(2, t1); } }
          }
          static void fill_rect(int x, int y, int w, int h, float r, float g, float b) {
            p_glClearColor(r, g, b, 1.f); p_glScissor(x, y, w, h); p_glClear(0x4000);
          }
          static void pad_draw(void) {   /* kursor (kotak putih berbingkai hitam) + penanda mode; glClear+scissor, state GL dipulihkan */
            int sb[4], x, y, show; float cc[4]; unsigned char was;
            show = (g_padmode == 0) || g_curshow > 0;
            if (g_padmode && g_curshow > 0) g_curshow--;
            if (!show && g_toast <= 0) return;
            if (!p_glClear || !p_glScissor || !p_glEnable || !p_glDisable || !p_glClearColor) return;
            sb[0] = 0; sb[1] = 0; sb[2] = g_sw; sb[3] = g_sh; cc[0] = cc[1] = cc[2] = 0.f; cc[3] = 1.f;
            was = p_glIsEnabled ? p_glIsEnabled(0x0C11) : 0;
            if (p_glGetIntegerv) p_glGetIntegerv(0x0C10, sb);
            if (p_glGetFloatv) p_glGetFloatv(0x0C22, cc);
            p_glEnable(0x0C11);
            if (show) {
              x = (int)g_cx; y = g_sh - (int)g_cy;
              fill_rect(x - 7, y - 7, 14, 14, 0.f, 0.f, 0.f);
              fill_rect(x - 5, y - 5, 10, 10, 1.f, 1.f, 1.f);
            }
            if (g_toast > 0) {              /* penanda mode di tengah-atas: hijau = CONTROLLER, putih = KURSOR */
              g_toast--;
              fill_rect(g_sw / 2 - 62, g_sh - 12, 124, 10, 0.f, 0.f, 0.f);
              if (g_padmode) fill_rect(g_sw / 2 - 60, g_sh - 10, 120, 6, 0.15f, 0.9f, 0.3f);
              else fill_rect(g_sw / 2 - 60, g_sh - 10, 120, 6, 1.f, 1.f, 1.f);
            }
            if (!was) p_glDisable(0x0C11);
            p_glScissor(sb[0], sb[1], sb[2], sb[3]);
            p_glClearColor(cc[0], cc[1], cc[2], cc[3]);
          }
          /* layout event SDL2 (32-bit): type@0, which@8, button/axis@12, state/value@13 (axis: int16 @16) */
          static void handle_event(const unsigned char *ev, int *quit) {
            uint32_t t; memcpy(&t, ev, 4);
            if (t == 0x100u) *quit = 1;
            else if (t == 0x300u) { int32_t sym; memcpy(&sym, ev + 20, 4); if (sym == 27) *quit = 1; }
            else if (t == 0x603u || t == 0x604u) { if (g_pad_log++ < 300) L("[pad] JOY button %d %s\n", ev[12], t == 0x603u ? "TURUN" : "naik"); }
            else if (t == 0x650u) { int16_t v; memcpy(&v, ev + 16, 2); if (ev[12] < 6) g_axv[ev[12]] = v; }
            else if (t == 0x651u || t == 0x652u) {
              int dn = (t == 0x651u), b = ev[12];
              if (g_pad_log++ < 300) L("[pad] CTRL button %d %s\n", b, dn ? "TURUN" : "naik");
              if (b == 4) { g_btn_back = dn; if (dn) g_sel_used = 0; else if (!g_sel_used) { pad_toggle(); return; } }   /* ketuk SELECT sendirian = ganti mode */
              if (b == 6) g_btn_start = dn;
              if (dn && g_btn_back && b != 4) g_sel_used = 1;     /* SELECT dipakai sebagai kombinasi -> jangan ganti mode saat dilepas */
              if (g_btn_back && g_btn_start) { *quit = 1; return; }      /* Select+Start = keluar */
              if (b == 4 || (b == 6 && g_btn_back)) return;
              pad_map(b, dn);
            }
          }

          static void run_stage3(const char *apk, int na, int nb, int frames) {
            int w = 640, h = 480, f, quit = 0, nerr = 0, r = 0;
            char libdir[480], files[480], cache[480];
            void *env = (void *)&g_env_p, *obj = jstrobj("com/unity3d/player/UnityPlayer");
            void *f_file = nf("nativeFile"), *f_initjni = nf("initJni"), *f_www = nf("nativeInitWWW"), *f_extras = nf("nativeSetExtras");
            void *f_init = nf("nativeInit"), *f_recreate = nf("nativeRecreateGfxState"), *f_resize = nf("nativeResize");
            void *f_uinit = nf("unityAndroidInit"), *f_uprep = nf("unityAndroidPrepareGameLoop"), *f_resume = nf("nativeResume");
            void *f_focus = nf("nativeFocusChanged"), *f_render = nf("nativeRender"), *f_pause = nf("nativePause");
            void *f_fwd = nf("nativeForwardEventsToDalvik");
            struct sigaction sa;
            g_nenv = env; g_nobj = obj;
            *(void **)&g_ntouch = nf("nativeTouch");
            if (!f_file || !f_init || !f_render || !f_resize) { L("[stage3] native penting tidak lengkap, berhenti\n"); return; }
            if (!getcwd(g_cwd, sizeof g_cwd)) snprintf(g_cwd, sizeof g_cwd, ".");
            { char *rp = realpath(apk, NULL); if (rp) { snprintf(g_apkabs, sizeof g_apkabs, "%s", rp); free(rp); } else snprintf(g_apkabs, sizeof g_apkabs, "%s/%s", g_cwd, apk); }
            snprintf(libdir, sizeof libdir, "%s/lib", g_cwd); snprintf(files, sizeof files, "%s/files", g_cwd); snprintf(cache, sizeof cache, "%s/cache", g_cwd);
            mkdir(libdir, 0755); mkdir(files, 0755); mkdir(cache, 0755);

            L("\n== STAGE 3: jendela SDL2 + konteks GLES2 ==\n");
            if (gl_init(&w, &h) != 0) { L("[stage3] GL gagal, berhenti\n"); return; }
            g_sw = w; g_sh = h; g_cx = (float)w / 2; g_cy = (float)h / 2;
            pad_init();
          pad_cfg_load();
            { static const int sgs[] = { SIGSEGV, SIGBUS, SIGILL, SIGFPE, SIGABRT }; int k;   /* SDL/Mali bisa menimpa handler sinyal kita */
              memset(&sa, 0, sizeof sa); sa.sa_sigaction = on_sig; sa.sa_flags = SA_SIGINFO | SA_ONSTACK;
              for (k = 0; k < 5; k++) sigaction(sgs[k], &sa, NULL); }

            L("\n== urutan init Unity (mengikuti UnityPlayer.java) ==\n");
            L("nativeFile(\"%s\")\n", g_apkabs);
            ((fn_p_t)f_file)(env, obj, jstr(g_apkabs));
            if (f_fwd) { L("nativeForwardEventsToDalvik(0)\n"); ((fn_i_t)f_fwd)(env, obj, 0); }
            if (f_initjni) { L("initJni()\n"); ((fn_v_t)f_initjni)(env, obj); }
            { void *f_pp = nf("InitPlayerPrefs"); if (f_pp) { L("InitPlayerPrefs()\n"); ((fn_v_t)f_pp)(env, jstrobj("com/unity3d/player/PlayerPrefs")); } }
            if (f_www) { L("nativeInitWWW(WWW)\n"); ((fn_p_t)f_www)(env, obj, jclsobj("com/unity3d/player/WWW")); }
            if (f_extras) { L("nativeSetExtras(Bundle)\n"); ((fn_p_t)f_extras)(env, obj, jstrobj("android/os/Bundle")); }
            L("nativeInit(%d, %d)\n", na, nb);
            ((fn_ii_t)f_init)(env, obj, na, nb);
            if (f_recreate) { L("nativeRecreateGfxState()\n"); ((fn_v_t)f_recreate)(env, obj); }
            L("nativeResize(%d,%d,%d,%d)\n", w, h, w, h);
            ((fn_iiii_t)f_resize)(env, obj, w, h, w, h);
            if (f_uinit) { L("unityAndroidInit(\"assets/bin/\", \"%s\")\n", libdir); ((fn_pp_t)f_uinit)(env, obj, jstr("assets/bin/"), jstr(libdir)); }
            if (f_uprep) { L("unityAndroidPrepareGameLoop()\n"); ((fn_v_t)f_uprep)(env, obj); }
            L("nativeResize + nativeResume + nativeFocusChanged(1)\n");
            ((fn_iiii_t)f_resize)(env, obj, w, h, w, h);
            if (f_resume) ((fn_v_t)f_resume)(env, obj);
            if (f_focus) ((fn_i_t)f_focus)(env, obj, 1);
            L("init selesai, masuk loop nativeRender (frames=%d, 0=tak terbatas)\n", frames);

            for (f = 0; !quit && (frames <= 0 || f < frames); f++) {
              unsigned char ev[64]; unsigned err;
              while (p_SDL_PollEvent(ev)) handle_event(ev, &quit);
              pad_tick();
              r = ((fn_r_t)f_render)(env, obj);
              pad_draw();
              p_SDL_GL_SwapWindow(g_win);
              err = p_glGetError ? p_glGetError() : 0;
              if (err && nerr < 10) { L("[gl] glGetError=0x%x pada frame %d\n", err, f); nerr++; }
              if (f < 5 || f % 120 == 0) L("[frame] %d nativeRender -> %d\n", f, r);
            }
            L("\n== keluar loop setelah %d frame ==\n", f);
            if (f_pause) { int pr = ((fn_r_t)f_pause)(env, obj); L("nativePause -> %d\n", pr); }
            L("\n== ringkasan panggilan JNI (log tertunda) selesai ==\n");
          }

          int main(int argc, char **argv) {
            static const char *p_gl1[] = { "libGLESv1_CM.so.1", "/usr/lib32/libGLESv1_CM.so.1", "/usr/lib32/libGLESv1_CM.so", NULL };
            static const char *p_gl2[] = { "libGLESv2.so.2", "/usr/lib32/libGLESv2.so.2", "/usr/lib32/libGLESv2.so", NULL };
            static const char *p_mali[] = { "libmali.so", "/usr/lib32/libmali.so", "/usr/lib32/libmali.so.1", NULL };
            static const char *p_egl[] = { "libEGL.so.1", "/usr/lib32/libEGL.so.1", "/usr/lib32/libEGL.so", NULL };
            const char *dir = "libs", *apk = "cordy.apk", *logf = "loader_log.txt";
