                  o.append("static uint32_t jstub_%d(void *e, void *o, void *m, va_list ap) { (void)e; (void)o; return jcall_v(%d, m, ap); }" % (k, k))
              elif nm.startswith("Call") and nm.endswith("MethodA"):
                  o.append("static uint32_t jstub_%d(void *e, void *o, void *m, const void *a) { (void)e; (void)o; return jcall_a(%d, m, a); }" % (k, k))
              elif nm.startswith("Call") and nm.endswith("Method"):
                  o.append("static uint32_t jstub_%d(void *e, void *o, void *m, ...) { va_list ap; uint32_t r; (void)e; (void)o; va_start(ap, m); r = jcall_v(%d, m, ap); va_end(ap); return r; }" % (k, k))
