name: build-cordy-loader-m5-padmodes
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pasang toolchain ARM 32-bit
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Tulis sumber dan skrip peluncur
        run: |
          mkdir -p src out/cordy_android/libs
          cat > src/cordyloader.c <<'EOF_C1'
          /* cordyloader - Milestone 2 port Cordy Android (Unity 3.5.4f1, armeabi-v7a -> armhf, muOS).
           * Memuat libmono.so + libunity.so ASLI (bionic) dengan loader ELF sendiri, memasang shim bionic->glibc,
           * lalu (bertahap) menjalankan konstruktor dan JNI_OnLoad dengan JNIEnv palsu.
           *   --dry / --stage 0 : muat + relokasi + laporan simbol (TIDAK ada kode game yang jalan)
           *   --stage 1         : + init_array (konstruktor C++) libmono lalu libunity
           *   --stage 2         : + JNI_OnLoad(libunity) dengan JNIEnv/JavaVM palsu, catat RegisterNatives (default)
           * Pakai: cordyloader LIBDIR [--stage N] [--dry] [--apk FILE] [--timeout S] [--log FILE]
           * Catatan glibc: JANGAN pakai strtol/atol/sscanf (header glibc baru mengikat ke GLIBC_2.38; device 2.37). */
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdarg.h>
          #include <errno.h>
          #include <elf.h>
          #include <dlfcn.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <signal.h>
          #include <pthread.h>
          #include <semaphore.h>
          #include <math.h>
          #include <time.h>
          #include <dirent.h>
          #include <netdb.h>
          #include <sched.h>
          #include <locale.h>
          #include <sys/mman.h>
          #include <sys/stat.h>
          #include <sys/syscall.h>
          #include <sys/utsname.h>
          #include <ucontext.h>
          #include <gnu/libc-version.h>

          #pragma GCC diagnostic ignored "-Wdeprecated-declarations"
          #pragma GCC diagnostic ignored "-Wcast-function-type"

          #define PAGE 4096u
          #define MAXMOD 4
          #define MOD_MAGIC 0x4d4f4443u
          #ifndef PT_ARM_EXIDX
          #define PT_ARM_EXIDX 0x70000001
          #endif

          /* Library Android armeabi-v7a memakai ABI softfp (float/double lewat r0-r3); proses ini hard-float.
           * Semua fungsi FP yang dipanggil game ATAU yang dipanggil-balik ke game harus memakai "aapcs" dasar. */
          #if defined(__arm__) && defined(__ARM_PCS_VFP)
          #define AAPCS __attribute__((pcs("aapcs")))
          #else
          #define AAPCS
          #endif

          #define U32(p) ((uint32_t)(uintptr_t)(p))
          #define PTR(v) ((void *)(uintptr_t)(v))

          /* ======================= log ======================= */
          static FILE *g_log;
          static void L(const char *fmt, ...) {
            va_list ap;
            va_start(ap, fmt); vprintf(fmt, ap); va_end(ap);
            fflush(stdout);
            if (g_log) { va_start(ap, fmt); vfprintf(g_log, fmt, ap); va_end(ap); fflush(g_log); }
          }
          static int pint(const char *s) { int v = 0; while (*s >= '0' && *s <= '9') v = v * 10 + (*s++ - '0'); return v; }

          /* ======================= modul ELF ======================= */
          typedef struct Mod {
            uint32_t magic; char name[64];
            uint8_t *base; size_t span; uintptr_t bias; uint32_t minv;
            uint8_t *file; size_t fsize;
            Elf32_Sym *sym; const char *str; int nsym;
            Elf32_Rel *rel; uint32_t nrel; Elf32_Rel *jrel; uint32_t njrel;
            uint32_t *iarr; uint32_t niarr; uint32_t init;
            uintptr_t exidx; uint32_t exidx_n;
          } Mod;
          static Mod mods[MAXMOD];
          static int nmods;

          static void *h_gl1, *h_gl2, *h_mali, *h_egl;

          static void describe(uintptr_t a, char *out, size_t n);
          static void *mod_find(const Mod *m, const char *name) {
            int i;
            for (i = 1; i < m->nsym; i++) {
              const Elf32_Sym *s = &m->sym[i];
              if (s->st_shndx != SHN_UNDEF && s->st_name && ELF32_ST_BIND(s->st_info) != STB_LOCAL &&
                  strcmp(m->str + s->st_name, name) == 0) return (void *)(m->bias + s->st_value);
            }
            return NULL;
          }

          static int load_mod(const char *dir, const char *name, Mod **out) {
            char path[512]; Mod *m; const Elf32_Ehdr *eh; const Elf32_Phdr *ph;
            uint32_t minv = 0xFFFFFFFFu, maxv = 0; int i, dyn_found = 0; FILE *f; long n;
            if (nmods >= MAXMOD) return -1;
            m = &mods[nmods]; memset(m, 0, sizeof *m);
            m->magic = MOD_MAGIC; snprintf(m->name, sizeof m->name, "%s", name);
            snprintf(path, sizeof path, "%s/%s", dir, name);
            f = fopen(path, "rb");
            if (!f) { L("GAGAL membuka %s\n", path); return -1; }
            fseek(f, 0, SEEK_END); n = ftell(f); fseek(f, 0, SEEK_SET);
            m->file = malloc((size_t)n);
            if (!m->file || fread(m->file, 1, (size_t)n, f) != (size_t)n) { fclose(f); L("GAGAL membaca %s\n", path); return -1; }
            fclose(f); m->fsize = (size_t)n;
            eh = (const Elf32_Ehdr *)m->file;
            if (m->fsize < sizeof *eh || memcmp(eh->e_ident, ELFMAG, SELFMAG) || eh->e_ident[EI_CLASS] != ELFCLASS32 ||
                eh->e_machine != EM_ARM || eh->e_type != ET_DYN) { L("%s: bukan ELF ARM32 shared object\n", name); return -1; }
            ph = (const Elf32_Phdr *)(m->file + eh->e_phoff);
            for (i = 0; i < eh->e_phnum; i++) if (ph[i].p_type == PT_LOAD) {
              if (ph[i].p_vaddr < minv) minv = ph[i].p_vaddr;
              if (ph[i].p_vaddr + ph[i].p_memsz > maxv) maxv = ph[i].p_vaddr + ph[i].p_memsz;
            }
            minv &= ~(PAGE - 1); maxv = (maxv + PAGE - 1) & ~(PAGE - 1);
            m->span = maxv - minv; m->minv = minv;
            m->base = mmap(NULL, m->span, PROT_READ | PROT_WRITE, MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
            if (m->base == MAP_FAILED) { L("%s: mmap gagal\n", name); return -1; }
            m->bias = (uintptr_t)m->base - minv;
            for (i = 0; i < eh->e_phnum; i++) {
              if (ph[i].p_type == PT_LOAD) {
                if ((size_t)ph[i].p_offset + ph[i].p_filesz > m->fsize) { L("%s: segmen melewati ujung file\n", name); return -1; }
                memcpy((void *)(m->bias + ph[i].p_vaddr), m->file + ph[i].p_offset, ph[i].p_filesz);
              } else if (ph[i].p_type == PT_ARM_EXIDX) {
                m->exidx = m->bias + ph[i].p_vaddr; m->exidx_n = ph[i].p_memsz / 8;
              }
            }
            for (i = 0; i < eh->e_phnum; i++) if (ph[i].p_type == PT_DYNAMIC) {
              const Elf32_Dyn *d = (const Elf32_Dyn *)(m->bias + ph[i].p_vaddr);
              dyn_found = 1;
              for (; d->d_tag != DT_NULL; d++) switch (d->d_tag) {
                case DT_SYMTAB: m->sym = (Elf32_Sym *)(m->bias + d->d_un.d_ptr); break;
                case DT_STRTAB: m->str = (const char *)(m->bias + d->d_un.d_ptr); break;
                case DT_REL: m->rel = (Elf32_Rel *)(m->bias + d->d_un.d_ptr); break;
                case DT_RELSZ: m->nrel = d->d_un.d_val / sizeof(Elf32_Rel); break;
                case DT_JMPREL: m->jrel = (Elf32_Rel *)(m->bias + d->d_un.d_ptr); break;
                case DT_PLTRELSZ: m->njrel = d->d_un.d_val / sizeof(Elf32_Rel); break;
                case DT_INIT: m->init = d->d_un.d_val; break;
                case DT_INIT_ARRAY: m->iarr = (uint32_t *)(m->bias + d->d_un.d_ptr); break;
                case DT_INIT_ARRAYSZ: m->niarr = d->d_un.d_val / 4; break;
                case DT_RELA: case DT_RELR:
                  L("%s: tipe relokasi tidak didukung (tag 0x%x)\n", name, (unsigned)d->d_tag); return -1;
                default: break;
              }
            }
            if (!dyn_found || !m->sym || !m->str) { L("%s: section dinamis tidak lengkap\n", name); return -1; }
            if (eh->e_shoff && (size_t)eh->e_shoff + (size_t)eh->e_shnum * sizeof(Elf32_Shdr) <= m->fsize) {
              const Elf32_Shdr *sh = (const Elf32_Shdr *)(m->file + eh->e_shoff);
              for (i = 0; i < eh->e_shnum; i++) if (sh[i].sh_type == SHT_DYNSYM) m->nsym = (int)(sh[i].sh_size / sizeof(Elf32_Sym));
            }
            if (m->nsym <= 0) { L("%s: jumlah simbol tidak diketahui\n", name); return -1; }
            nmods++; *out = m;
            L("[load] %s: base=%p span=0x%zx simbol=%d rel=%u jmprel=%u init_array=%u exidx=%u\n", name, (void *)m->base,
              m->span, m->nsym, m->nrel, m->njrel, m->niarr, m->exidx_n);
            return 0;
          }

          /* proteksi akhir per halaman dari flag PT_LOAD (relokasi TEXTREL sudah selesai saat segmen masih RW) */
          static void protect_mod(Mod *m) {
            const Elf32_Ehdr *eh = (const Elf32_Ehdr *)m->file;
            const Elf32_Phdr *ph = (const Elf32_Phdr *)(m->file + eh->e_phoff);
            size_t npg = m->span / PAGE, p, q; uint8_t *fl = calloc(npg, 1); int i;
            for (i = 0; i < eh->e_phnum; i++) if (ph[i].p_type == PT_LOAD) {
              uint32_t a = ph[i].p_vaddr & ~(PAGE - 1), e = (ph[i].p_vaddr + ph[i].p_memsz + PAGE - 1) & ~(PAGE - 1);
              int pr = ((ph[i].p_flags & PF_R) ? PROT_READ : 0) | ((ph[i].p_flags & PF_W) ? PROT_WRITE : 0) | ((ph[i].p_flags & PF_X) ? PROT_EXEC : 0);
              for (p = (a - m->minv) / PAGE; p < (e - m->minv) / PAGE && p < npg; p++) fl[p] |= (uint8_t)pr;
            }
            for (p = 0; p < npg;) {
              for (q = p; q < npg && fl[q] == fl[p]; q++) {}
              if (fl[p] && mprotect(m->base + p * PAGE, (q - p) * PAGE, fl[p]) != 0) L("[protect] %s: mprotect gagal: %s\n", m->name, strerror(errno));
              p = q;
            }
            __builtin___clear_cache((char *)m->base, (char *)m->base + m->span);
            free(fl);
          }

          /* ======================= shim: variabel & fungsi bionic ======================= */
          static uint32_t b_stack_chk_guard = 0x5a17c0deu;
          static char bionic_sF[3 * 84];                       /* sizeof(FILE) bionic lama = 84; stdin/out/err = &__sF[0..2] */
          static int b_data_start;
          static uint32_t b_page_size = 4096;
          static const char *p_ctype; static const short *p_tolower, *p_toupper;   /* di bionic lama ketiganya VARIABEL POINTER */
          static char ctype_tab[257]; static short lower_tab[257], upper_tab[257];

          static void init_ctype(void) {
            int c;
            lower_tab[0] = -1; upper_tab[0] = -1;
            for (c = 0; c < 256; c++) {
              unsigned f = 0;
              if (c >= 'A' && c <= 'Z') f |= 0x01;
              if (c >= 'a' && c <= 'z') f |= 0x02;
              if (c >= '0' && c <= '9') f |= 0x04;
              if (c == ' ' || (c >= 9 && c <= 13)) f |= 0x08;
              if ((c >= 33 && c <= 47) || (c >= 58 && c <= 64) || (c >= 91 && c <= 96) || (c >= 123 && c <= 126)) f |= 0x10;
              if (c < 32 || c == 127) f |= 0x20;
              if ((c >= '0' && c <= '9') || (c >= 'A' && c <= 'F') || (c >= 'a' && c <= 'f')) f |= 0x40;
              if (c == ' ') f |= 0x80;
              ctype_tab[c + 1] = (char)f;
              lower_tab[c + 1] = (short)((c >= 'A' && c <= 'Z') ? c + 32 : c);
              upper_tab[c + 1] = (short)((c >= 'a' && c <= 'z') ? c - 32 : c);
            }
            p_ctype = ctype_tab; p_tolower = lower_tab; p_toupper = upper_tab;
            {
              static const int16_t fl[3] = { 0x0004, 0x0009, 0x000a };   /* __SRD ; __SWR|__SLBF ; __SWR|__SNBF */
              for (c = 0; c < 3; c++) { int16_t *h = (int16_t *)(bionic_sF + c * 84); h[6] = fl[c]; h[7] = (int16_t)c; }   /* _flags@12 _file@14 */
            }
          }

          static int *b_errno(void) { return __errno_location(); }
          static int *b_get_h_errno(void) { return __h_errno_location(); }
          static void b_cxa_finalize(void *d) { (void)d; }
          static int b_atexit(void (*fn)(void)) { (void)fn; return 0; }
          /* Sinyal real-time: bionic ARM memakai 32 dan 33 (SIGRTMIN=32; Mono memakai 32 sebagai sinyal abort-thread). glibc MENCADANGKAN 32/33
           * untuk NPTL (SIGCANCEL/SIGSETXID) sehingga sigaction(32) = EINVAL -> "Assertion at mini-posix.c:381". Petakan 32->SIGRTMIN, 33->SIGRTMIN+1. */
          static int msig(int s) { return s == 32 ? SIGRTMIN : s == 33 ? SIGRTMIN + 1 : s; }
          static int b_gettid(void) { return (int)syscall(SYS_gettid); }
          static int b_tkill(int tid, int sig) { return (int)syscall(SYS_tkill, tid, sig ? msig(sig) : 0); }
          static void *b_bsd_signal(int sig, void *h) { return (void *)signal(msig(sig), (void (*)(int))h); }
          static size_t b_strlcpy(char *d, const char *s, size_t n) {
            size_t l = strlen(s);
            if (n) { size_t c = l >= n ? n - 1 : l; memcpy(d, s, c); d[c] = 0; }
            return l;
          }
          static char *b_setlocale(int c, const char *l) { (void)c; (void)l; return (char *)"C"; }
          static void *b_null(void) { return NULL; }          /* getpwnam/getpwuid/getgrgid/getgrnam: struct bionic beda -> NULL */

          /* --- log android --- */
          static void alog(int prio, const char *tag, const char *msg) {
            size_t n = strlen(msg);
            (void)prio;
            L("[alog] %s: %.*s\n", tag ? tag : "?", (int)((n && msg[n - 1] == '\n') ? n - 1 : n), msg);
          }
          static int b_log_print(int prio, const char *tag, const char *fmt, ...) {
            char buf[1024]; va_list ap; va_start(ap, fmt); vsnprintf(buf, sizeof buf, fmt, ap); va_end(ap); alog(prio, tag, buf); return 0;
          }
          static int b_log_vprint(int prio, const char *tag, const char *fmt, va_list ap) {
            char buf[1024]; vsnprintf(buf, sizeof buf, fmt, ap); alog(prio, tag, buf); return 0;
          }
          static int b_log_write(int prio, const char *tag, const char *text) { alog(prio, tag, text); return 0; }

          /* --- stdio: FILE* dari __sF dipetakan ke stdin/stdout/stderr glibc --- */
          static FILE *mf(void *f) {
            uintptr_t a = (uintptr_t)f, b = (uintptr_t)bionic_sF;
            if (a >= b && a < b + sizeof bionic_sF) { unsigned i = (unsigned)((a - b) / 84); return i == 0 ? stdin : i == 1 ? stdout : stderr; }
            return (FILE *)f;
          }
          static int b_fprintf(void *f, const char *fmt, ...) { va_list ap; int r; va_start(ap, fmt); r = vfprintf(mf(f), fmt, ap); va_end(ap); return r; }
          static int b_vfprintf(void *f, const char *fmt, va_list ap) { return vfprintf(mf(f), fmt, ap); }
          static int b_fputs(const char *s, void *f) { return fputs(s, mf(f)); }
          static int b_fputc(int c, void *f) { return fputc(c, mf(f)); }
          static size_t b_fwrite(const void *p, size_t s, size_t n, void *f) { return fwrite(p, s, n, mf(f)); }
          static size_t b_fread(void *p, size_t s, size_t n, void *f) { return fread(p, s, n, mf(f)); }
          static int b_fflush(void *f) { return fflush(f ? mf(f) : NULL); }
          static char *b_fgets(char *s, int n, void *f) { return fgets(s, n, mf(f)); }
          static int b_fgetc(void *f) { return fgetc(mf(f)); }
          static int b_ungetc(int c, void *f) { return ungetc(c, mf(f)); }
          static int b_setvbuf(void *f, char *b, int m, size_t s) { return setvbuf(mf(f), b, m, s); }
          static int b_feof(void *f) { return feof(mf(f)); }
          static int b_ferror(void *f) { return ferror(mf(f)); }
          static void b_clearerr(void *f) { clearerr(mf(f)); }
          static int b_fclose(void *f) { FILE *r = mf(f); return (r == stdin || r == stdout || r == stderr) ? 0 : fclose(r); }

          /* Mono JIT (mini-arm.c) membaca /proc/cpuinfo: butuh "Processor ... (v7" dan "Features ... thumb". Kernel aarch64 menampilkan
           * format 64-bit (tanpa "thumb") -> assert `thumb_supported' gagal. Hanya untuk pemanggil dari libmono kita sajikan cpuinfo ARMv7 palsu
           * (tanpa "neon" agar jalur kode Unity tidak berubah); pemanggil lain tetap membaca file asli. */
          __attribute__((noinline)) static FILE *b_fopen(const char *p, const char *m) {
            static const char ci[] =
              "Processor\t: ARMv7 Processor rev 4 (v7l)\nBogoMIPS\t: 48.00\n"
              "Features\t: swp half thumb fastmult vfp edsp vfpv3 tls\n"
              "CPU implementer\t: 0x41\nCPU architecture: 7\nCPU variant\t: 0x0\nCPU part\t: 0xd03\nCPU revision\t: 4\n\n"
              "Hardware\t: Generic\nRevision\t: 0000\nSerial\t\t: 0000000000000000\n";
            if (p && !strcmp(p, "/proc/cpuinfo")) {
              uintptr_t ra = (uintptr_t)__builtin_return_address(0); int k;
              for (k = 0; k < nmods; k++)
                if (strstr(mods[k].name, "libmono") && ra >= (uintptr_t)mods[k].base && ra < (uintptr_t)mods[k].base + mods[k].span) {
                  FILE *f = fmemopen((void *)ci, sizeof ci - 1, "r");
                  if (f) { L("[cpuinfo] libmono membuka /proc/cpuinfo -> cpuinfo ARMv7 palsu\n"); return f; }
                }
            }
            return fopen(p, m);
          }
          static int b_fseek(void *f, long o, int w) { return fseek(mf(f), o, w); }
          static long b_ftell(void *f) { return ftell(mf(f)); }
          static int b_fileno(void *f) { return fileno(mf(f)); }
          static int b_fgetpos(void *f, long *pos) { long p = ftell(mf(f)); if (p < 0) return -1; *pos = p; return 0; }   /* fpos_t bionic = off_t */
          static int b_fsetpos(void *f, const long *pos) { return fseek(mf(f), *pos, SEEK_SET); }

          /* --- stat/dirent: layout bionic ARM32 = stat64/dirent64 kernel --- */
          #ifndef SYS_stat64
          #define SYS_stat64 195
          #define SYS_lstat64 196
          #define SYS_fstat64 197
          #endif
          /* PENTING: header glibc baru di CI bisa memakai struct stat64 versi time64 (>104 byte) -> menimpa buffer bionic 104 byte.
           * Syscall mentah mengisi persis layout kernel ARM EABI stat64 = struct stat bionic. */
          static int b_stat(const char *p, void *b) { return (int)syscall(SYS_stat64, p, b); }
          static int b_fstat(int fd, void *b) { return (int)syscall(SYS_fstat64, fd, b); }
          static int b_lstat(const char *p, void *b) { return (int)syscall(SYS_lstat64, p, b); }

          /* --- sysconf: nilai _SC_* bionic berbeda dari glibc (VERIFIKASI bila ada perilaku aneh) --- */
          static long b_sysconf(int n) {
            switch (n) {
              case 0x00: return sysconf(_SC_ARG_MAX);
              case 0x06: return sysconf(_SC_CLK_TCK);
              case 0x0b: return sysconf(_SC_OPEN_MAX);
              case 0x27: return sysconf(_SC_PAGESIZE);
              case 0x60: return sysconf(_SC_NPROCESSORS_CONF);
              case 0x61: return sysconf(_SC_NPROCESSORS_ONLN);
              case 0x62: return sysconf(_SC_PHYS_PAGES);
              case 0x63: return sysconf(_SC_AVPHYS_PAGES);
              default: L("[SHIM] sysconf(0x%x) tidak dikenal -> -1\n", n); errno = EINVAL; return -1;
            }
          }

          /* --- setjmp/longjmp: jmp_buf bionic cuma 256 byte, glibc 388 -> tulis sendiri (r4-r11, sp, lr, d8-d15 = 104 byte) --- */
          #if defined(__arm__)
          __asm__(
            ".text\n.arm\n.align 2\n"
            ".global cordy_setjmp\n.type cordy_setjmp, %function\ncordy_setjmp:\n"
            "  stmia r0!, {r4-r11}\n  str sp, [r0], #4\n  str lr, [r0], #4\n  vstmia r0!, {d8-d15}\n  mov r0, #0\n  bx lr\n"
            ".global cordy_longjmp\n.type cordy_longjmp, %function\ncordy_longjmp:\n"
            "  ldmia r0!, {r4-r11}\n  ldr sp, [r0], #4\n  ldr lr, [r0], #4\n  vldmia r0!, {d8-d15}\n  movs r0, r1\n  moveq r0, #1\n  bx lr\n"
            ".thumb\n");
          extern int cordy_setjmp(void *);
          extern void cordy_longjmp(void *, int);
          #else
          static int cordy_setjmp(void *b) { (void)b; return 0; }
          static void cordy_longjmp(void *b, int v) { (void)b; (void)v; abort(); }
          #endif

          /* --- unwinder: libunity membawa unwinder C++ sendiri dan menanyakan exidx modul yang kita muat --- */
          static void *b_find_exidx(uintptr_t pc, int *count) {
            int i;
            for (i = 0; i < nmods; i++) {
              const Mod *m = &mods[i];
              if (m->exidx && pc >= (uintptr_t)m->base && pc < (uintptr_t)m->base + m->span) { *count = (int)m->exidx_n; return (void *)m->exidx; }
            }
            *count = 0; return NULL;
          }

          /* --- __pthread_cleanup_push/pop (versi fungsi bionic) --- */
          typedef struct BClean { struct BClean *prev; void (*fn)(void *); void *arg; } BClean;
          static __thread BClean *t_clean;
          static void b_cleanup_push(BClean *c, void (*fn)(void *), void *arg) { c->prev = t_clean; c->fn = fn; c->arg = arg; t_clean = c; }
          static void b_cleanup_pop(BClean *c, int exec) { t_clean = c->prev; if (exec && c->fn) c->fn(c->arg); }

          /* --- SHA1 (dulu diekspor libc bionic; urutan OpenBSD: SHA1Final(digest, ctx)) --- */
          typedef struct { uint32_t st[5]; uint32_t cnt[2]; uint8_t buf[64]; } SHA1C;   /* 92 byte <= SHA1_CTX bionic */
          #define ROL(v, b) (((v) << (b)) | ((v) >> (32 - (b))))
          static void sha1_tr(uint32_t s[5], const uint8_t *p) {
            uint32_t w[80], a, b, c, d, e, t; int i;
            for (i = 0; i < 16; i++) w[i] = (uint32_t)p[4 * i] << 24 | (uint32_t)p[4 * i + 1] << 16 | (uint32_t)p[4 * i + 2] << 8 | p[4 * i + 3];
            for (i = 16; i < 80; i++) w[i] = ROL(w[i - 3] ^ w[i - 8] ^ w[i - 14] ^ w[i - 16], 1);
            a = s[0]; b = s[1]; c = s[2]; d = s[3]; e = s[4];
            for (i = 0; i < 80; i++) {
              uint32_t f, k;
              if (i < 20) { f = (b & c) | (~b & d); k = 0x5A827999u; }
              else if (i < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1u; }
              else if (i < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDCu; }
              else { f = b ^ c ^ d; k = 0xCA62C1D6u; }
              t = ROL(a, 5) + f + e + k + w[i]; e = d; d = c; c = ROL(b, 30); b = a; a = t;
            }
            s[0] += a; s[1] += b; s[2] += c; s[3] += d; s[4] += e;
          }
          static void b_SHA1Init(SHA1C *c) {
            c->st[0] = 0x67452301u; c->st[1] = 0xEFCDAB89u; c->st[2] = 0x98BADCFEu; c->st[3] = 0x10325476u; c->st[4] = 0xC3D2E1F0u;
            c->cnt[0] = c->cnt[1] = 0;
          }
          static void b_SHA1Update(SHA1C *c, const uint8_t *d, size_t n) {
            size_t i;
            for (i = 0; i < n; i++) {
              c->buf[c->cnt[0] & 63] = d[i];
              if (++c->cnt[0] == 0) c->cnt[1]++;
              if ((c->cnt[0] & 63) == 0) sha1_tr(c->st, c->buf);
            }
          }
          static void b_SHA1Final(uint8_t dig[20], SHA1C *c) {
            uint32_t hi = (c->cnt[1] << 3) | (c->cnt[0] >> 29), lo = c->cnt[0] << 3; uint8_t pad = 0x80, z = 0, len[8]; int i;
            b_SHA1Update(c, &pad, 1);
            while ((c->cnt[0] & 63) != 56) b_SHA1Update(c, &z, 1);
            for (i = 0; i < 4; i++) { len[i] = (uint8_t)(hi >> (24 - 8 * i)); len[4 + i] = (uint8_t)(lo >> (24 - 8 * i)); }
            b_SHA1Update(c, len, 8);
            for (i = 0; i < 20; i++) dig[i] = (uint8_t)(c->st[i >> 2] >> (24 - 8 * (i & 3)));
          }

          /* ======================= shim pthread/sem: objek bionic 4 byte -> simpan pointer ke objek glibc (lazy) ======================= */
          static pthread_mutex_t g_initlock = PTHREAD_MUTEX_INITIALIZER;
          static pthread_mutex_t *mx_get(uint32_t *slot) {
            uint32_t v = *(volatile uint32_t *)slot;
            if (v > 0xFFFFu) return (pthread_mutex_t *)PTR(v);
            pthread_mutex_lock(&g_initlock);
            v = *slot;
            if (v <= 0xFFFFu) {   /* nilai kecil = static initializer bionic: 0 normal, 0x4000 recursive, 0x8000 errorcheck */
              pthread_mutex_t *m = calloc(1, sizeof *m); pthread_mutexattr_t a;
              pthread_mutexattr_init(&a);
              if (v & 0x4000) pthread_mutexattr_settype(&a, PTHREAD_MUTEX_RECURSIVE);
              else if (v & 0x8000) pthread_mutexattr_settype(&a, PTHREAD_MUTEX_ERRORCHECK);
              pthread_mutex_init(m, &a); pthread_mutexattr_destroy(&a);
              *slot = U32(m); v = *slot;
            }
            pthread_mutex_unlock(&g_initlock);
            return (pthread_mutex_t *)PTR(v);
          }
          static int b_mutex_init(uint32_t *slot, const long *attr) {
            pthread_mutex_t *m = calloc(1, sizeof *m); pthread_mutexattr_t a;
            pthread_mutexattr_init(&a);
            if (attr && *attr == 1) pthread_mutexattr_settype(&a, PTHREAD_MUTEX_RECURSIVE);
            else if (attr && *attr == 2) pthread_mutexattr_settype(&a, PTHREAD_MUTEX_ERRORCHECK);
            pthread_mutex_init(m, &a); pthread_mutexattr_destroy(&a);
            *slot = U32(m); return 0;
          }
          static int b_mutex_destroy(uint32_t *slot) {
            if (*slot > 0xFFFFu) { pthread_mutex_t *m = (pthread_mutex_t *)PTR(*slot); pthread_mutex_destroy(m); free(m); }
            *slot = 0; return 0;
          }
          static int b_mutex_lock(uint32_t *s) { return pthread_mutex_lock(mx_get(s)); }
          static int b_mutex_unlock(uint32_t *s) { return pthread_mutex_unlock(mx_get(s)); }
          static int b_mutex_trylock(uint32_t *s) { return pthread_mutex_trylock(mx_get(s)); }
          static int b_mutexattr_init(long *a) { *a = 0; return 0; }
          static int b_mutexattr_settype(long *a, int t) { *a = t; return 0; }
          static int b_mutexattr_gettype(const long *a, int *t) { *t = (int)*a; return 0; }
          static int b_mutexattr_destroy(long *a) { (void)a; return 0; }

          static pthread_cond_t *cv_get(uint32_t *slot) {
            uint32_t v = *(volatile uint32_t *)slot;
            if (v > 0xFFFFu) return (pthread_cond_t *)PTR(v);
            pthread_mutex_lock(&g_initlock);
            v = *slot;
            if (v <= 0xFFFFu) { pthread_cond_t *c = calloc(1, sizeof *c); pthread_cond_init(c, NULL); *slot = U32(c); v = *slot; }
            pthread_mutex_unlock(&g_initlock);
            return (pthread_cond_t *)PTR(v);
          }
          static int b_cond_init(uint32_t *slot, const void *attr) { pthread_cond_t *c = calloc(1, sizeof *c); (void)attr; pthread_cond_init(c, NULL); *slot = U32(c); return 0; }
          static int b_cond_destroy(uint32_t *slot) {
            if (*slot > 0xFFFFu) { pthread_cond_t *c = (pthread_cond_t *)PTR(*slot); pthread_cond_destroy(c); free(c); }
            *slot = 0; return 0;
          }
          static int b_cond_wait(uint32_t *c, uint32_t *m) { return pthread_cond_wait(cv_get(c), mx_get(m)); }
          static int b_cond_timedwait(uint32_t *c, uint32_t *m, const void *t) {
            static int (*f)(pthread_cond_t *, pthread_mutex_t *, const void *);   /* simbol default glibc = timespec 32-bit */
            if (!f) *(void **)&f = dlsym(RTLD_DEFAULT, "pthread_cond_timedwait");
            return f(cv_get(c), mx_get(m), t);
          }
          static int b_cond_signal(uint32_t *c) { return pthread_cond_signal(cv_get(c)); }
          static int b_cond_broadcast(uint32_t *c) { return pthread_cond_broadcast(cv_get(c)); }

          static sem_t *sm_get(uint32_t *slot) { return *slot > 0xFFFFu ? (sem_t *)PTR(*slot) : NULL; }
          static int b_sem_init(uint32_t *slot, int ps, unsigned v) {
            sem_t *s = calloc(1, sizeof *s);
            if (sem_init(s, ps, v) != 0) { free(s); return -1; }
            *slot = U32(s); return 0;
          }
          static int b_sem_destroy(uint32_t *slot) { sem_t *s = sm_get(slot); if (s) { sem_destroy(s); free(s); } *slot = 0; return 0; }
          static int b_sem_wait(uint32_t *slot) { sem_t *s = sm_get(slot); if (!s) { errno = EINVAL; return -1; } return sem_wait(s); }
          static int b_sem_trywait(uint32_t *slot) { sem_t *s = sm_get(slot); if (!s) { errno = EINVAL; return -1; } return sem_trywait(s); }
          static int b_sem_post(uint32_t *slot) { sem_t *s = sm_get(slot); if (!s) { errno = EINVAL; return -1; } return sem_post(s); }
          static int b_sem_timedwait(uint32_t *slot, const void *t) {
            static int (*f)(sem_t *, const void *);
            sem_t *s = sm_get(slot);
            if (!s) { errno = EINVAL; return -1; }
            if (!f) *(void **)&f = dlsym(RTLD_DEFAULT, "sem_timedwait");
            return f(s, t);
          }
          static int b_sem_getvalue(uint32_t *slot, int *v) { sem_t *s = sm_get(slot); if (!s) { errno = EINVAL; return -1; } return sem_getvalue(s, v); }

          /* pthread_attr_t bionic: {flags, stack_base, stack_size, guard_size, sched_policy, sched_priority} */
          typedef struct { uint32_t flags; void *stack_base; size_t stack_size; size_t guard_size; int32_t policy; int32_t prio; } BAttr;
          static int b_attr_init(BAttr *a) { memset(a, 0, sizeof *a); a->stack_size = 1024 * 1024; a->guard_size = 4096; return 0; }
          static int b_attr_destroy(BAttr *a) { (void)a; return 0; }
          static int b_attr_setdetachstate(BAttr *a, int s) { if (s) a->flags |= 1; else a->flags &= ~1u; return 0; }
          static int b_attr_getdetachstate(const BAttr *a, int *s) { *s = (int)(a->flags & 1); return 0; }
          static int b_attr_setstacksize(BAttr *a, size_t s) { a->stack_size = s; return 0; }
          static int b_attr_getstacksize(const BAttr *a, size_t *s) { *s = a->stack_size; return 0; }
          static int b_attr_setschedpolicy(BAttr *a, int p) { a->policy = p; return 0; }
          static int b_attr_setschedparam(BAttr *a, const struct sched_param *p) { a->prio = p->sched_priority; return 0; }
          static int b_attr_getstack(const BAttr *a, void **base, size_t *sz) { *base = a->stack_base; *sz = a->stack_size; return 0; }
          static int b_getattr_np(pthread_t th, BAttr *a) {
            pthread_attr_t ga; void *addr = NULL; size_t sz = 0; int ds = 0, r;
            b_attr_init(a);
            r = pthread_getattr_np(th, &ga);
            if (r) return r;
            pthread_attr_getstack(&ga, &addr, &sz); pthread_attr_getdetachstate(&ga, &ds);
            a->stack_base = addr; a->stack_size = sz; if (ds == PTHREAD_CREATE_DETACHED) a->flags |= 1;
            pthread_attr_destroy(&ga); return 0;
          }
          static int b_pthread_create(pthread_t *t, const BAttr *a, void *(*fn)(void *), void *arg) {
            pthread_attr_t ga; int r;
            if (!a) return pthread_create(t, NULL, fn, arg);
            pthread_attr_init(&ga);
            if (a->flags & 1) pthread_attr_setdetachstate(&ga, PTHREAD_CREATE_DETACHED);
            if (a->stack_size >= 16384) pthread_attr_setstacksize(&ga, a->stack_size);
            r = pthread_create(t, &ga, fn, arg); pthread_attr_destroy(&ga); return r;
          }

          /* ======================= shim sinyal: sigset_t bionic = 32 bit; struct sigaction beda; sinyal RT 32/33 dipetakan ======================= */
          typedef struct { void *handler; uint32_t mask; int flags; void *restorer; } BSA;
          static void bs2gs(const uint32_t *b, sigset_t *g) { int i; sigemptyset(g); if (!b) return; for (i = 1; i <= 32; i++) if (*b & (1u << (i - 1))) sigaddset(g, msig(i)); }
          static void gs2bs(const sigset_t *g, uint32_t *b) { int i; *b = 0; for (i = 1; i <= 32; i++) if (sigismember(g, msig(i)) == 1) *b |= 1u << (i - 1); }
          /* handler game untuk sinyal 32: game mengharapkan nomor bionic (32) di argumen pertama, bukan nomor glibc hasil pemetaan */
          static BSA g_rt32;
          static void rt32_tramp(int s, siginfo_t *si, void *uc) {
            (void)s;
            if (!g_rt32.handler) return;
            if (g_rt32.flags & SA_SIGINFO) ((void (*)(int, siginfo_t *, void *))g_rt32.handler)(32, si, uc);
            else ((void (*)(int))g_rt32.handler)(32);
          }
          static int b_sigaction(int sig, const BSA *act, BSA *old) {
            struct sigaction a, o; int r, gs = msig(sig);
            memset(&a, 0, sizeof a); memset(&o, 0, sizeof o);
            if (act) {
              a.sa_sigaction = (void (*)(int, siginfo_t *, void *))act->handler; bs2gs(&act->mask, &a.sa_mask);
              a.sa_flags = act->flags & ~0x04000000;   /* buang SA_RESTORER: restorer glibc dipasang sendiri */
              if (sig == 32 && (uintptr_t)act->handler > 1u) { g_rt32 = *act; a.sa_sigaction = rt32_tramp; a.sa_flags |= SA_SIGINFO; }
              L("[sig] game memasang handler sinyal %d%s: %p flags=0x%x\n", sig, gs != sig ? " (dipetakan ke sinyal glibc lain)" : "", act->handler, (unsigned)act->flags);
            }
            r = sigaction(gs, act ? &a : NULL, old ? &o : NULL);
            if (r != 0) L("[sig] sigaction(%d -> %d) GAGAL: errno=%d (%s)\n", sig, gs, errno, strerror(errno));
            if (old && r == 0) {
              old->handler = (sig == 32 && (uintptr_t)o.sa_sigaction == (uintptr_t)rt32_tramp) ? g_rt32.handler : (void *)o.sa_sigaction;
              gs2bs(&o.sa_mask, &old->mask); old->flags = o.sa_flags; old->restorer = NULL;
            }
            return r;
          }
          static int b_sigprocmask(int how, const uint32_t *s, uint32_t *o) {
            sigset_t gs, go; int r;
            bs2gs(s, &gs);
            r = sigprocmask(how, s ? &gs : NULL, o ? &go : NULL);
            if (o && r == 0) gs2bs(&go, o);
            return r;
          }
          static int b_pthread_sigmask(int how, const uint32_t *s, uint32_t *o) {
            sigset_t gs, go; int r;
            bs2gs(s, &gs);
            r = pthread_sigmask(how, s ? &gs : NULL, o ? &go : NULL);
            if (o && r == 0) gs2bs(&go, o);
            return r;
          }
          static int b_pthread_kill(pthread_t t, int sig) { return pthread_kill(t, sig ? msig(sig) : 0); }
          static int b_kill(int pid, int sig) { return kill(pid, sig ? msig(sig) : 0); }
          static int b_raise(int sig) { return raise(msig(sig)); }
          static int b_sigsuspend(const uint32_t *m) { sigset_t gs; bs2gs(m, &gs); return sigsuspend(&gs); }

          /* ======================= shim FP: softfp (game) -> hard-float (glibc/libm/GL) ======================= */
          /* Fungsi libm di-resolve lewat dlsym saat runtime (bukan link-time): glibc runner CI baru (2.38-2.43) memberi versi simbol
           * baru (mis. sinf@GLIBC_2.43, fmod@GLIBC_2.38) yang tidak ada di device (2.37). dlsym di device mengambil versi default yang benar. */
          static void *fsym(const char *n) {
            void *p = dlsym(RTLD_DEFAULT, n);
            if (!p) { L("[FATAL] fungsi libm %s tidak ditemukan\n", n); _exit(98); }
            return p;
          }
          #define W1F(n) AAPCS static float w_##n(float x) { static float (*f)(float); if (!f) *(void **)&f = fsym(#n); return f(x); }
          #define W2F(n) AAPCS static float w_##n(float x, float y) { static float (*f)(float, float); if (!f) *(void **)&f = fsym(#n); return f(x, y); }
          #define W1D(n) AAPCS static double w_##n(double x) { static double (*f)(double); if (!f) *(void **)&f = fsym(#n); return f(x); }
          #define W2D(n) AAPCS static double w_##n(double x, double y) { static double (*f)(double, double); if (!f) *(void **)&f = fsym(#n); return f(x, y); }
          W1F(sinf) W1F(cosf) W1F(tanf) W1F(asinf) W1F(acosf) W1F(atanf) W1F(sqrtf) W1F(floorf) W1F(ceilf) W1F(fabsf)
          W1F(expf) W1F(logf) W1F(log10f) W1F(log2f) W1F(roundf) W1F(truncf) W1F(rintf) W1F(sinhf) W1F(coshf) W1F(tanhf)
          W2F(powf) W2F(atan2f) W2F(fmodf) W2F(hypotf)
          W1D(sin) W1D(cos) W1D(tan) W1D(asin) W1D(acos) W1D(atan) W1D(sqrt) W1D(floor) W1D(ceil) W1D(fabs)
          W1D(exp) W1D(log) W1D(log10) W1D(log2) W1D(round) W1D(trunc) W1D(rint) W1D(sinh) W1D(cosh) W1D(tanh)
          W2D(pow) W2D(atan2) W2D(fmod) W2D(hypot)
          AAPCS static double w_ldexp(double x, int e) { static double (*f)(double, int); if (!f) *(void **)&f = fsym("ldexp"); return f(x, e); }
          AAPCS static float w_ldexpf(float x, int e) { static float (*f)(float, int); if (!f) *(void **)&f = fsym("ldexpf"); return f(x, e); }
          AAPCS static double w_frexp(double x, int *e) { static double (*f)(double, int *); if (!f) *(void **)&f = fsym("frexp"); return f(x, e); }
          AAPCS static float w_frexpf(float x, int *e) { static float (*f)(float, int *); if (!f) *(void **)&f = fsym("frexpf"); return f(x, e); }
          AAPCS static double w_modf(double x, double *i) { static double (*f)(double, double *); if (!f) *(void **)&f = fsym("modf"); return f(x, i); }
          AAPCS static float w_modff(float x, float *i) { static float (*f)(float, float *); if (!f) *(void **)&f = fsym("modff"); return f(x, i); }
          AAPCS static long w_lrintf(float x) { static long (*f)(float); if (!f) *(void **)&f = fsym("lrintf"); return f(x); }
          AAPCS static long w_lrint(double x) { static long (*f)(double); if (!f) *(void **)&f = fsym("lrint"); return f(x); }
          AAPCS static long w_lroundf(float x) { static long (*f)(float); if (!f) *(void **)&f = fsym("lroundf"); return f(x); }
          AAPCS static long w_lround(double x) { static long (*f)(double); if (!f) *(void **)&f = fsym("lround"); return f(x); }
          AAPCS static double w_strtod(const char *s, char **e) { return strtod(s, e); }
          AAPCS static float w_strtof(const char *s, char **e) { return strtof(s, e); }
          AAPCS static double w_atof(const char *s) { return atof(s); }

          /* KONSTANTA FP_*: nilai bionic (INFINITE=1 NAN=2 NORMAL=4 SUBNORMAL=8 ZERO=0x10) BERBEDA dari glibc (NAN=0 INFINITE=1 ZERO=2 SUBNORMAL=3 NORMAL=4).
           * Dengan nilai glibc, angka 0.0 terbaca "NAN" oleh kode game (2 = FP_NAN bionic) -> semua collider dengan komponen nol dianggap tidak valid.
           * Env CORDY_FPCLASS=glibc mengembalikan perilaku lama. */
          static int fpc_glibc(void) { static int m = -1; if (m < 0) { const char *e = getenv("CORDY_FPCLASS"); m = (e && !strcmp(e, "glibc")) ? 1 : 0; } return m; }
          AAPCS static int w___fpclassifyf(float x) {
            if (fpc_glibc()) return __builtin_fpclassify(FP_NAN, FP_INFINITE, FP_NORMAL, FP_SUBNORMAL, FP_ZERO, x);
            return __builtin_fpclassify(0x02, 0x01, 0x04, 0x08, 0x10, x);
          }
          AAPCS static int w___fpclassify(double x) {
            if (fpc_glibc()) return __builtin_fpclassify(FP_NAN, FP_INFINITE, FP_NORMAL, FP_SUBNORMAL, FP_ZERO, x);
            return __builtin_fpclassify(0x02, 0x01, 0x04, 0x08, 0x10, x);
          }
          AAPCS static int w___isnanf(float x) { return x != x; }
          AAPCS static int w___isinff(float x) { return (x == x && x - x != 0) ? (x > 0 ? 1 : -1) : 0; }
          AAPCS static int w___finitef(float x) { return x - x == 0; }
          AAPCS static int w_isnan(double x) { return x != x; }
          AAPCS static int w_isinf(double x) { return (x == x && x - x != 0) ? (x > 0 ? 1 : -1) : 0; }
          AAPCS static int w_finite(double x) { return x - x == 0; }

          static void *glsym(const char *n) {
            void *p = NULL;
            if (h_gl1 && (p = dlsym(h_gl1, n))) return p;
            if (h_gl2 && (p = dlsym(h_gl2, n))) return p;
            if (h_mali && (p = dlsym(h_mali, n))) return p;
            if (h_egl && (p = dlsym(h_egl, n))) return p;
            L("[gl] simbol %s tidak ditemukan\n", n); return NULL;
          }
          typedef void (*gl_ff4)(float, float, float, float);
          typedef void (*gl_f1)(float);
          typedef void (*gl_if)(unsigned, float);
          typedef void (*gl_iif)(unsigned, unsigned, float);
          AAPCS static void w_glClearColor(float r, float g, float b, float a) { static gl_ff4 f; if (!f) *(void **)&f = glsym("glClearColor"); f(r, g, b, a); }
          AAPCS static void w_glColor4f(float r, float g, float b, float a) { static gl_ff4 f; if (!f) *(void **)&f = glsym("glColor4f"); f(r, g, b, a); }
          AAPCS static void w_glClearDepthf(float d) { static gl_f1 f; if (!f) *(void **)&f = glsym("glClearDepthf"); f(d); }
          AAPCS static void w_glAlphaFunc(unsigned fn, float r) { static gl_if f; if (!f) *(void **)&f = glsym("glAlphaFunc"); f(fn, r); }
          AAPCS static void w_glFogf(unsigned p, float v) { static gl_if f; if (!f) *(void **)&f = glsym("glFogf"); f(p, v); }
          AAPCS static void w_glLightModelf(unsigned p, float v) { static gl_if f; if (!f) *(void **)&f = glsym("glLightModelf"); f(p, v); }
          AAPCS static void w_glLightf(unsigned l, unsigned p, float v) { static gl_iif f; if (!f) *(void **)&f = glsym("glLightf"); f(l, p, v); }
          AAPCS static void w_glMaterialf(unsigned l, unsigned p, float v) { static gl_iif f; if (!f) *(void **)&f = glsym("glMaterialf"); f(l, p, v); }
          AAPCS static void w_glTexParameterf(unsigned l, unsigned p, float v) { static gl_iif f; if (!f) *(void **)&f = glsym("glTexParameterf"); f(l, p, v); }
