           * Matikan dengan env CORDY_NOPATCH=1. Ini hanya agar game lanjut dan log berikutnya terlihat; penyebab actor gagal tetap dicari. */

          static int apply_patch(Mod *m, const char *name, uint32_t v, const uint8_t *orig, const uint8_t *neu, size_t n) {
            uint8_t *a; uintptr_t pg, pe;
            if (v + n > m->minv + m->span) { L("[patch] %s: di luar modul\n", name); return -1; }
            a = (uint8_t *)(m->bias + v);
            if (memcmp(a, orig, n) != 0) { L("[patch] %s: byte tidak cocok, tidak dipasang\n", name); return -1; }
            pg = (uintptr_t)a & ~(uintptr_t)(PAGE - 1); pe = ((uintptr_t)a + n + PAGE - 1) & ~(uintptr_t)(PAGE - 1);
            if (mprotect((void *)pg, pe - pg, PROT_READ | PROT_WRITE | PROT_EXEC) != 0) { L("[patch] %s: mprotect RWX gagal: %s\n", name, strerror(errno)); return -1; }
            memcpy(a, neu, n);
            mprotect((void *)pg, pe - pg, PROT_READ | PROT_EXEC);
            __builtin___clear_cache((char *)a, (char *)a + n);
            L("[patch] %s terpasang di libunity+0x%x\n", name, v);
            return 0;
          }
