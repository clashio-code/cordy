          /* ======================= resolusi simbol & relokasi ======================= */
          static int g_kc[5];                       /* 1=modul 2=shim 3=gl 4=glibc 0=tak ada */
          static const char *g_unres[512]; static int g_nunres;
          static const char *g_fpwarn[256]; static int g_nfp;
          static const char *g_eh[64]; static int g_neh;
          static const char *g_shimhit[256]; static int g_nsh;
          static uint32_t *stub_pool; static int stub_n; static const int STUB_MAX = 4096;

          static void note(const char **arr, int *n, int max, const char *s) {
            int i;
            for (i = 0; i < *n; i++) if (!strcmp(arr[i], s)) return;
            if (*n < max) arr[(*n)++] = s;
          }
          __attribute__((noreturn)) static void unres_handler(const char *name) {
            L("\n[UNRES] game memanggil simbol yang tidak tersedia: %s\n", name);
            if (g_log) fflush(g_log);
            _exit(97);
          }
          /* stub ARM 16 byte: ldr r0,[pc]; ldr pc,[pc]; .word nama; .word handler */
          static void *make_stub(const char *name) {
            uint32_t *p;
            if (!stub_pool) { stub_pool = mmap(NULL, STUB_MAX * 16, PROT_READ | PROT_WRITE, MAP_PRIVATE | MAP_ANONYMOUS, -1, 0); if (stub_pool == MAP_FAILED) { stub_pool = NULL; return NULL; } }
            if (stub_n >= STUB_MAX) return NULL;
            p = stub_pool + stub_n * 4; stub_n++;
            p[0] = 0xE59F0000u; p[1] = 0xE59FF000u; p[2] = U32(name); p[3] = U32(unres_handler);
            return p;
          }
          static const char *const trace_names[] = { "_Znwj", "_Znaj", "_ZdlPv", "_ZdaPv", "_ZnwjRKSt9nothrow_t", "malloc", "calloc", "realloc", "free", "memalign", "posix_memalign", "sbrk", "brk", NULL };
          static void *resolve_inner(const char *n, int weak);
          static void *resolve(const char *n, int weak) {
            void *p = resolve_inner(n, weak); int i;
            for (i = 0; trace_names[i]; i++) if (!strcmp(trace_names[i], n)) {
              Dl_info di; int has = p && dladdr(p, &di) && di.dli_fname;
              char d[200]; describe((uintptr_t)p & ~1u, d, sizeof d);
              L("[resolve] %-22s -> %p  (%s)\n", n, p, d[0] != '?' ? d : (has ? di.dli_fname : "?"));
              break;
            }
            return p;
          }
          static void *resolve_inner(const char *n, int weak) {
            void *p; int i;
            for (i = 0; i < nmods; i++) if ((p = mod_find(&mods[i], n))) { g_kc[1]++; return p; }
            for (i = 0; shims[i].name; i++) if (!strcmp(shims[i].name, n)) { g_kc[2]++; note(g_shimhit, &g_nsh, 256, shims[i].name); return shims[i].addr; }
            if (n[0] == 'g' && n[1] == 'l') { if ((p = glsym(n))) { g_kc[3]++; return p; } }
            if ((p = dlsym(RTLD_DEFAULT, n))) {
              Dl_info di; g_kc[4]++;
              if (dladdr(p, &di) && di.dli_fname && strstr(di.dli_fname, "libm")) note(g_fpwarn, &g_nfp, 256, n);
              if (!strncmp(n, "_Unwind", 7) || !strncmp(n, "__cxa_throw", 11) || !strncmp(n, "__gxx_personality", 17) || !strncmp(n, "__cxa_begin_catch", 17)) note(g_eh, &g_neh, 64, n);
              return p;
            }
            if (weak) return NULL;
            g_kc[0]++; note(g_unres, &g_nunres, 512, n);
            return make_stub(n);
          }

          static int reloc_table(Mod *m, Elf32_Rel *r, uint32_t n) {
            uint32_t i;
            for (i = 0; i < n; i++) {
              uint32_t *where = (uint32_t *)(m->bias + r[i].r_offset);
              int type = (int)ELF32_R_TYPE(r[i].r_info); uint32_t si = ELF32_R_SYM(r[i].r_info), S_ = 0;
              if (type == R_ARM_RELATIVE) { *where += (uint32_t)m->bias; continue; }
              if (si) {
                const Elf32_Sym *s = &m->sym[si]; const char *nm = m->str + s->st_name;
                if (s->st_shndx != SHN_UNDEF) S_ = (uint32_t)(m->bias + s->st_value);
                else S_ = U32(resolve(nm, ELF32_ST_BIND(s->st_info) == STB_WEAK));
              }
              switch (type) {
                case R_ARM_ABS32: *where += S_; break;
                case R_ARM_GLOB_DAT: case R_ARM_JUMP_SLOT: *where = S_; break;
                default: L("[reloc] %s: tipe %d tidak didukung @0x%x\n", m->name, type, (unsigned)r[i].r_offset); return -1;
              }
            }
            return 0;
          }
          static int relocate(Mod *m) {
            if (reloc_table(m, m->rel, m->nrel) || reloc_table(m, m->jrel, m->njrel)) return -1;
            return 0;
          }

          /* ======================= crash handler & diagnostik ======================= */
          static void describe(uintptr_t a, char *out, size_t n) {
            int i;
            for (i = 0; i < nmods; i++) {
              const Mod *m = &mods[i];
              if (a >= (uintptr_t)m->base && a < (uintptr_t)m->base + m->span) {
                uintptr_t off = a - m->bias, bv = 0; const char *best = NULL; int k;
                for (k = 1; k < m->nsym; k++) {
                  const Elf32_Sym *s = &m->sym[k]; uintptr_t v = s->st_value & ~1u;
                  if (s->st_shndx == SHN_UNDEF || !s->st_name || ELF32_ST_TYPE(s->st_info) != STT_FUNC) continue;
                  if (v <= off && v >= bv) { bv = v; best = m->str + s->st_name; }
                }
                snprintf(out, n, "%s+0x%x%s%s", m->name, (unsigned)(a - (uintptr_t)m->base), best ? " (" : "", best ? best : "");
                if (best) { size_t l = strlen(out); if (l + 2 < n) snprintf(out + l, n - l, "+0x%x)", (unsigned)(off - bv)); }
                return;
              }
            }
            snprintf(out, n, "?");
          }
          static void on_sig(int sig, siginfo_t *si, void *ucp) {
            char d[200]; ucontext_t *uc = (ucontext_t *)ucp; int i;
            L("\n[CRASH] sinyal %d (%s) alamat_fault=%p\n", sig, strsignal(sig), si ? si->si_addr : NULL);
          #if defined(__arm__)
            {
              uintptr_t sp = uc->uc_mcontext.arm_sp, *w = (uintptr_t *)sp;
              describe(uc->uc_mcontext.arm_pc, d, sizeof d); L("  pc=%08lx %s\n", uc->uc_mcontext.arm_pc, d);
              describe(uc->uc_mcontext.arm_lr, d, sizeof d); L("  lr=%08lx %s\n", uc->uc_mcontext.arm_lr, d);
              L("  r0=%08lx r1=%08lx r2=%08lx r3=%08lx r4=%08lx r5=%08lx\n", uc->uc_mcontext.arm_r0, uc->uc_mcontext.arm_r1, uc->uc_mcontext.arm_r2, uc->uc_mcontext.arm_r3, uc->uc_mcontext.arm_r4, uc->uc_mcontext.arm_r5);
              L("  r6=%08lx r7=%08lx r8=%08lx r9=%08lx r10=%08lx fp=%08lx sp=%08lx\n", uc->uc_mcontext.arm_r6, uc->uc_mcontext.arm_r7, uc->uc_mcontext.arm_r8, uc->uc_mcontext.arm_r9, uc->uc_mcontext.arm_r10, uc->uc_mcontext.arm_fp, sp);
              L("  cpsr=%08lx (%s)\n", uc->uc_mcontext.arm_cpsr, (uc->uc_mcontext.arm_cpsr & 0x20) ? "Thumb" : "ARM");
              {
                uintptr_t pc = uc->uc_mcontext.arm_pc & ~1u, a;
                for (i = 0; i < nmods; i++) {
                  const Mod *m = &mods[i];
                  if (pc >= (uintptr_t)m->base && pc < (uintptr_t)m->base + m->span) {
                    uintptr_t from = pc - 0x180, to = pc + 0x40;
                    if (from < (uintptr_t)m->base) from = (uintptr_t)m->base;
                    if (to > (uintptr_t)m->base + m->span) to = (uintptr_t)m->base + m->span;
                    L("  vaddr di %s: 0x%x (objdump -d -M force-thumb --start-address=0x%x --stop-address=0x%x)\n", m->name, (unsigned)(pc - m->bias), (unsigned)(from - m->bias), (unsigned)(to - m->bias));
                    for (a = from; a < to; a += 16) {
                      int k; L("  kode %06x:", (unsigned)(a - m->bias));
                      for (k = 0; k < 16 && a + k < to; k++) L(" %02x", ((uint8_t *)a)[k]);
                      L("\n");
                    }
                  }
                }
              }
              L("  stack mentah (32 kata):\n");
              for (i = 0; i < 32; i++) {
                uintptr_t addr = sp + (uintptr_t)i * 4; unsigned char vec;
                if (i == 0 || (addr & (PAGE - 1)) == 0) { if (mincore((void *)(addr & ~(PAGE - 1)), PAGE, &vec) != 0) break; }
                L("    [sp+%02d] %08lx\n", i * 4, (unsigned long)w[i]);
              }
              L("  backtrace kasar (scan stack):\n");
              for (i = 0; i < 1024; i++) {
                uintptr_t addr = sp + (uintptr_t)i * 4, v; unsigned char vec;
                if (i == 0 || (addr & (PAGE - 1)) == 0) { if (mincore((void *)(addr & ~(PAGE - 1)), PAGE, &vec) != 0) break; }
                v = w[i]; describe(v, d, sizeof d);
                if (d[0] != '?') L("    [sp+%d] %08lx %s\n", i * 4, (unsigned long)v, d);
              }
            }
          #else
            (void)uc; (void)d; (void)i;
          #endif
            _exit(100 + sig);
          }
          static void on_alarm(int sig, siginfo_t *si, void *ucp) { (void)sig; (void)si; L("\n[TIMEOUT] loader melewati batas waktu (kemungkinan hang di konstruktor/JNI_OnLoad)\n"); on_sig(SIGABRT, NULL, ucp); }

