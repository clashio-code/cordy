          #include "stubs.inc"
          /* ======================= PlayerPrefs nyata (default benar + persisten) =======================
           * Sebelumnya: GetInt/GetFloat selalu 0 dan GetString "" (argumen default dibuang) -> script game mendapat nilai nol
           * (mis. skala/massa/kecepatan = 0). Sekarang: nilai tersimpan dibaca, bila tidak ada dikembalikan argumen default. */
          typedef struct { char k[96]; char t; int i; float f; char s[256]; } PPE;
          static PPE g_pp[256]; static int g_npp, g_pp_loaded, g_pp_dirty, g_pplog;
          static uint32_t f2u(float f) { uint32_t u; memcpy(&u, &f, 4); return u; }
          static void pp_clean(char *s) { for (; *s; s++) if (*s == '\t' || *s == '\n' || *s == '\r') *s = ' '; }
          static void pp_save(void) {
            char p[460], tmp[470]; FILE *fp; int i;
            snprintf(p, sizeof p, "%s/files/prefs.txt", g_cwd); snprintf(tmp, sizeof tmp, "%s.tmp", p);
            fp = fopen(tmp, "w"); if (!fp) { L("[prefs] gagal menulis %s: %s\n", tmp, strerror(errno)); return; }
            for (i = 0; i < g_npp; i++) {
              if (g_pp[i].t == 'I') fprintf(fp, "I\t%s\t%d\n", g_pp[i].k, g_pp[i].i);
              else if (g_pp[i].t == 'F') fprintf(fp, "F\t%s\t%.9g\n", g_pp[i].k, (double)g_pp[i].f);
              else fprintf(fp, "S\t%s\t%s\n", g_pp[i].k, g_pp[i].s);
            }
            fclose(fp); rename(tmp, p); g_pp_dirty = 0;
          }
          static void pp_load(void) {
            char p[460], ln[512]; FILE *fp; g_pp_loaded = 1;
            snprintf(p, sizeof p, "%s/files/prefs.txt", g_cwd);
            fp = fopen(p, "r"); if (!fp) { L("[prefs] belum ada %s (mulai kosong)\n", p); return; }
            while (fgets(ln, sizeof ln, fp) && g_npp < 256) {
              char *a, *b; size_t n = strlen(ln); PPE *e;
              while (n && (ln[n - 1] == '\n' || ln[n - 1] == '\r')) ln[--n] = 0;
              if (n < 4 || ln[1] != '\t') continue;
              a = ln + 2; b = strchr(a, '\t'); if (!b) continue; *b++ = 0;
              e = &g_pp[g_npp++]; memset(e, 0, sizeof *e);
              snprintf(e->k, sizeof e->k, "%.95s", a); e->t = ln[0];
              if (e->t == 'I') { const char *q = b; int neg = 0, v = 0; if (*q == '-') { neg = 1; q++; } while (*q >= '0' && *q <= '9') v = v * 10 + (*q++ - '0'); e->i = neg ? -v : v; } else if (e->t == 'F') e->f = (float)atof(b); else snprintf(e->s, sizeof e->s, "%s", b);
            }
            fclose(fp); L("[prefs] dimuat %d kunci dari %s\n", g_npp, p);
          }
          static PPE *pp_find(const char *k) { int i; for (i = 0; i < g_npp; i++) if (!strcmp(g_pp[i].k, k)) return &g_pp[i]; return NULL; }
          static PPE *pp_slot(const char *k) {
            PPE *e = pp_find(k);
            if (!e && g_npp < 256) { e = &g_pp[g_npp++]; memset(e, 0, sizeof *e); snprintf(e->k, sizeof e->k, "%s", k); }
