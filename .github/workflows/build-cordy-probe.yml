name: build-armhf-cordy-probe
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pasang toolchain ARM 32-bit
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Tulis sumber dan skrip peluncur
        run: |
          mkdir -p src out/cordy_android/libs
          cat > src/elfprobe.c <<'EOF_C1'
          /* elfprobe - Milestone 1 port Cordy Android (Unity 3.5.4f1, armeabi-v7a -> armhf, muOS / RG40XV).
           * HANYA MEMBACA: mem-parse libunity.so + libmono.so (ELF32 ARM, bionic), lalu cek tiap simbol impor
           * terhadap library 32-bit milik device (glibc, Mali GLES/EGL, gl4es). Tidak menjalankan kode game.
           * Pakai: elfprobe libunity.so libmono.so [report.txt]
           * (pakai lib ASLI dari assets/libs/armeabi-v7a/ di APK, BUKAN stub proxy di lib/armeabi-v7a/)
           * Catatan glibc: JANGAN pakai strlcpy/strtol/sscanf dkk (header baru bisa mengikat ke GLIBC_2.38, batas device 2.37). */
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdarg.h>
          #include <elf.h>
          #include <dlfcn.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/mman.h>
          #include <sys/stat.h>
          #include <sys/utsname.h>
          #include <gnu/libc-version.h>

          #define MAXN 2048
          #ifndef PT_ARM_EXIDX
          #define PT_ARM_EXIDX 0x70000001
          #endif

          typedef struct {
            const uint8_t *map; size_t size;
            const Elf32_Ehdr *eh; const Elf32_Shdr *sh; const Elf32_Phdr *ph;
            const Elf32_Sym *sym; int nsym; const char *str;
            const Elf32_Dyn *dyn; int ndyn;
            int reltype[256]; int nrel;
            int has_tls, textrel, has_exidx;
            uint32_t tls_memsz, tls_align, exidx_vaddr, exidx_sz, init_arraysz, has_init;
          } Lib;

          static FILE *rep;
          static void *h_gl1, *h_gl2, *h_mali, *h_gl4es, *h_egl;

          static void P(const char *fmt, ...) {
            va_list ap;
            va_start(ap, fmt); vprintf(fmt, ap); va_end(ap);
            if (rep) { va_start(ap, fmt); vfprintf(rep, fmt, ap); va_end(ap); }
          }

          static int load_lib(const char *path, Lib *L) {
            struct stat st;
            int fd, i;
            memset(L, 0, sizeof *L);
            fd = open(path, O_RDONLY);
            if (fd < 0) { P("GAGAL membuka %s\n", path); return -1; }
            if (fstat(fd, &st) != 0) { close(fd); return -1; }
            L->size = (size_t)st.st_size;
            L->map = mmap(NULL, L->size, PROT_READ, MAP_PRIVATE, fd, 0);
            close(fd);
            if (L->map == MAP_FAILED) { P("GAGAL mmap %s\n", path); return -1; }
            if (L->size < sizeof(Elf32_Ehdr) || memcmp(L->map, ELFMAG, SELFMAG) != 0) { P("%s bukan file ELF\n", path); return -1; }
            L->eh = (const Elf32_Ehdr *)L->map;
            if (L->eh->e_ident[EI_CLASS] != ELFCLASS32 || L->eh->e_machine != EM_ARM) {
              P("%s bukan ELF ARM 32-bit (class=%d machine=%d)\n", path, L->eh->e_ident[EI_CLASS], L->eh->e_machine);
              return -1;
            }
            if (L->eh->e_shoff == 0 || L->eh->e_shentsize != sizeof(Elf32_Shdr) ||
                (size_t)L->eh->e_shoff + (size_t)L->eh->e_shnum * sizeof(Elf32_Shdr) > L->size) {
              P("%s: section header tidak ada/rusak\n", path); return -1;
            }
            L->sh = (const Elf32_Shdr *)(L->map + L->eh->e_shoff);
            if (L->eh->e_phoff && L->eh->e_phentsize == sizeof(Elf32_Phdr) &&
                (size_t)L->eh->e_phoff + (size_t)L->eh->e_phnum * sizeof(Elf32_Phdr) <= L->size) {
              L->ph = (const Elf32_Phdr *)(L->map + L->eh->e_phoff);
              for (i = 0; i < L->eh->e_phnum; i++) {
                if (L->ph[i].p_type == PT_TLS) { L->has_tls = 1; L->tls_memsz = L->ph[i].p_memsz; L->tls_align = L->ph[i].p_align; }
                if (L->ph[i].p_type == PT_ARM_EXIDX) { L->has_exidx = 1; L->exidx_vaddr = L->ph[i].p_vaddr; L->exidx_sz = L->ph[i].p_memsz; }
              }
            }
            for (i = 0; i < L->eh->e_shnum; i++) {
              const Elf32_Shdr *s = &L->sh[i];
              if ((size_t)s->sh_offset + s->sh_size > L->size) continue;
              if (s->sh_type == SHT_DYNSYM) {
                L->sym = (const Elf32_Sym *)(L->map + s->sh_offset);
                L->nsym = (int)(s->sh_size / sizeof(Elf32_Sym));
                if (s->sh_link < L->eh->e_shnum) L->str = (const char *)(L->map + L->sh[s->sh_link].sh_offset);
              } else if (s->sh_type == SHT_DYNAMIC) {
                L->dyn = (const Elf32_Dyn *)(L->map + s->sh_offset);
                L->ndyn = (int)(s->sh_size / sizeof(Elf32_Dyn));
              } else if (s->sh_type == SHT_REL) {
                const Elf32_Rel *r = (const Elf32_Rel *)(L->map + s->sh_offset);
                uint32_t k, n = s->sh_size / sizeof(Elf32_Rel);
                for (k = 0; k < n; k++) { L->reltype[ELF32_R_TYPE(r[k].r_info) & 0xff]++; L->nrel++; }
              }
            }
            if (!L->sym || !L->str) { P("%s: .dynsym tidak ditemukan\n", path); return -1; }
            for (i = 0; i < L->ndyn; i++) {
              int32_t t = L->dyn[i].d_tag;
              if (t == DT_TEXTREL) L->textrel = 1;
              else if (t == DT_FLAGS && (L->dyn[i].d_un.d_val & DF_TEXTREL)) L->textrel = 1;
              else if (t == DT_INIT_ARRAYSZ) L->init_arraysz = L->dyn[i].d_un.d_val;
              else if (t == DT_INIT) L->has_init = 1;
            }
            return 0;
          }

          static void print_needed(const Lib *L) {
            int i;
            for (i = 0; i < L->ndyn; i++) {
              if (L->dyn[i].d_tag == DT_NEEDED) P("  NEEDED %s\n", L->str + L->dyn[i].d_un.d_val);
              else if (L->dyn[i].d_tag == DT_SONAME) P("  SONAME %s\n", L->str + L->dyn[i].d_un.d_val);
            }
          }

          static const char *reltype_name(int t) {
            switch (t) {
              case 2: return "R_ARM_ABS32"; case 20: return "R_ARM_COPY"; case 21: return "R_ARM_GLOB_DAT";
              case 22: return "R_ARM_JUMP_SLOT"; case 23: return "R_ARM_RELATIVE"; case 17: return "R_ARM_TLS_DTPMOD32";
              case 18: return "R_ARM_TLS_DTPOFF32"; case 19: return "R_ARM_TLS_TPOFF32"; case 160: return "R_ARM_IRELATIVE";
              default: return NULL;
            }
          }

          /* info yang menentukan desain loader M2 */
          static void print_loader_info(const Lib *L) {
            int t;
            P("  PT_TLS: %s", L->has_tls ? "ADA" : "tidak ada");
            if (L->has_tls) P(" (memsz=%u align=%u)", L->tls_memsz, L->tls_align);
            P("\n  PT_ARM_EXIDX (unwind C++/EHABI): %s", L->has_exidx ? "ADA" : "tidak ada");
            if (L->has_exidx) P(" (vaddr=0x%x size=%u)", L->exidx_vaddr, L->exidx_sz);
            P("\n  TEXTREL (relokasi di segmen kode, butuh mprotect): %s\n", L->textrel ? "YA" : "tidak");
            P("  DT_INIT: %s | init_array: %u entri\n", L->has_init ? "ada" : "tidak ada", L->init_arraysz / 4);
            P("  relokasi REL total=%d:", L->nrel);
            for (t = 0; t < 256; t++) {
              if (!L->reltype[t]) continue;
              if (reltype_name(t)) P(" %s=%d", reltype_name(t), L->reltype[t]);
              else P(" tipe%d=%d", t, L->reltype[t]);
            }
            P("\n");
          }

          static int has_export(const Lib *L, const char *name) {
            int i;
            for (i = 1; i < L->nsym; i++) {
              const Elf32_Sym *s = &L->sym[i];
              if (s->st_shndx != SHN_UNDEF && s->st_name && strcmp(L->str + s->st_name, name) == 0) return 1;
            }
            return 0;
          }

          /* simbol khas bionic (tidak ada / semantiknya beda di glibc) -> WAJIB shim */
          static int bionic_only(const char *n) {
            static const char *l[] = { "__sF", "__stack_chk_guard", "_ctype_", "_tolower_tab_", "_toupper_tab_",
              "__errno", "__get_h_errno", "__page_size", "bsd_signal", "__pthread_cleanup_push", "__pthread_cleanup_pop",
              "__gnu_Unwind_Find_exidx", "gettid", "tkill", "data_start", "__isthreaded", "strlcpy", "strlcat",
              "__android_log_print", "__android_log_vprint", "__android_log_write", "__cxa_finalize", NULL };
            int i;
            for (i = 0; l[i]; i++) if (strcmp(n, l[i]) == 0) return 1;
            return 0;
          }

          /* simbol yang ada di glibc tapi layout/ABI-nya BEDA dari bionic (Android) -> perlu pembungkus */
          static int abi_risky(const char *n) {
            static const char *pfx[] = { "pthread_", "sem_", "stat", "fstat", "lstat", "readdir", "scandir",
              "opendir", "closedir", "setjmp", "longjmp", "_setjmp", "_longjmp", "sigsetjmp", "siglongjmp",
              "sigaction", "signal", "sigprocmask", "sigsuspend", "pthread", "dlopen", "dlsym", "dlclose", "dlerror",
              "fgetpos", "fsetpos", "getaddrinfo", "freeaddrinfo", "gethostby", "getpw", "getgr", "sysconf",
              "pipe", "poll", "epoll", "select", "mmap", "mremap", "clock_", "getrusage", "sched_", "prctl", "uname",
              "ioctl", "fcntl", "flock", "lseek", "truncate", "ftruncate", "setlocale", NULL };
            int i;
            for (i = 0; pfx[i]; i++) if (strncmp(n, pfx[i], strlen(pfx[i])) == 0) return 1;
            return 0;
          }

          static void *try_any(const char *what, const char **paths) {
            int i;
            for (i = 0; paths[i]; i++) {
              void *h = dlopen(paths[i], RTLD_LAZY | RTLD_LOCAL);
              if (h) { P("  %-14s : OK  (%s)\n", what, paths[i]); return h; }
            }
            P("  %-14s : TIDAK KETEMU. Terakhir dicoba: %s\n", what, dlerror());
            return NULL;
          }

          static int in_gl(const char *n, int *c1, int *c2, int *m, int *g) {
            *c1 = h_gl1 && dlsym(h_gl1, n) != NULL;
            *c2 = h_gl2 && dlsym(h_gl2, n) != NULL;
            *m = h_mali && dlsym(h_mali, n) != NULL;
            *g = h_gl4es && dlsym(h_gl4es, n) != NULL;
            return *c1 || *c2 || *m || *g;
          }

          typedef struct { const char *name[MAXN]; int n; } List;
          static void add(List *l, const char *s) { if (l->n < MAXN) l->name[l->n++] = s; }
          static void dump(const char *title, const List *l) {
            int i;
            P("\n-- %s (%d)\n", title, l->n);
            for (i = 0; i < l->n; i++) P("  %s\n", l->name[i]);
          }

          static void classify(const Lib *L, const Lib *prov, const char *label, const char *provlabel) {
            static List pv, bio, ok, risky, gl, miss;
            int i, nimp = 0, c1, c2, m, g;
            memset(&pv, 0, sizeof pv); memset(&bio, 0, sizeof bio); memset(&ok, 0, sizeof ok);
            memset(&risky, 0, sizeof risky); memset(&gl, 0, sizeof gl); memset(&miss, 0, sizeof miss);
            P("\n=== %s: klasifikasi simbol impor ===\n", label);
            for (i = 1; i < L->nsym; i++) {
              const Elf32_Sym *s = &L->sym[i];
              const char *n;
              if (s->st_shndx != SHN_UNDEF || !s->st_name) continue;
              n = L->str + s->st_name;
              nimp++;
              if (prov && has_export(prov, n)) { add(&pv, n); continue; }
              if (bionic_only(n)) { add(&bio, n); continue; }
              if (dlsym(RTLD_DEFAULT, n)) { if (abi_risky(n)) add(&risky, n); else add(&ok, n); continue; }
              if (in_gl(n, &c1, &c2, &m, &g)) { add(&gl, n); continue; }
              add(&miss, n);
            }
            P("total impor=%d | dari %s=%d | khas bionic (WAJIB shim)=%d | ada di glibc (aman)=%d | ada di glibc tapi ABI beda=%d | ada di GL device=%d | TIDAK ADA=%d\n",
              nimp, provlabel, pv.n, bio.n, ok.n, risky.n, gl.n, miss.n);
            dump("BIONIC-ONLY: wajib shim (data/semantik beda)", &bio);
            dump("ABI-RISK: ada di glibc tapi perlu pembungkus", &risky);
            dump("TIDAK ADA: perlu shim/implementasi sendiri", &miss);
          }

          static void gl_report(const Lib *L) {
            int i, total = 0, direct = 0, none = 0;
            P("\n=== fungsi GL/EGL yang dipakai libunity.so ===\n");
            P("  kolom: 1=libGLESv1_CM  2=libGLESv2  M=libmali  G=gl4es  (-=tidak ada)\n");
            P("  catatan: fungsi *OES (framebuffer/mapbuffer) biasanya lewat eglGetProcAddress, bukan dlsym.\n");
            for (i = 1; i < L->nsym; i++) {
              const Elf32_Sym *s = &L->sym[i];
              const char *n;
              int c1, c2, m, g;
              if (s->st_shndx != SHN_UNDEF || !s->st_name) continue;
              n = L->str + s->st_name;
              if (strncmp(n, "gl", 2) != 0 && strncmp(n, "egl", 3) != 0) continue;
              in_gl(n, &c1, &c2, &m, &g);
              total++;
              if (c1 || c2 || m) direct++;
              if (!c1 && !c2 && !m && !g) none++;
              P("  %c%c%c%c %s\n", c1 ? '1' : '-', c2 ? '2' : '-', m ? 'M' : '-', g ? 'G' : '-', n);
            }
            P("ringkas: %d fungsi GL/EGL dipakai | %d tersedia langsung di GLESv1/GLESv2/mali | %d tidak ada di mana pun\n", total, direct, none);
          }

          /* ---- pindai string di file: petunjuk untuk desain JNI palsu & RegisterNatives (M2) ---- */
          static int printable(uint8_t c) { return c >= 0x20 && c < 0x7f; }
          static void scan_strings(const Lib *L, const char *title, int mode, int maxn) {
            const char *seen[400];
            int nseen = 0, k;
            size_t i = 0;
            P("\n-- %s\n", title);
            while (i < L->size && nseen < maxn && nseen < 400) {
              size_t j;
              int len, take = 0;
              const char *s;
              if (!printable(L->map[i]) || (i > 0 && L->map[i - 1] != 0)) { i++; continue; }
              for (j = i; j < L->size && printable(L->map[j]); j++) {}
              if (j >= L->size || L->map[j] != 0) { i = j + 1; continue; }
              s = (const char *)(L->map + i);
              len = (int)(j - i);
              if (mode == 0) take = len >= 8 && len < 120 && (strstr(s, "com/unity3d/") || strstr(s, "com/silvertree/") ||
                                    strstr(s, "org/fmod/") || strncmp(s, "java/", 5) == 0 || strncmp(s, "android/", 8) == 0);
              else if (mode == 1) take = len >= 8 && len < 60 && strncmp(s, "native", 6) == 0 && !strchr(s, ' ');
              else if (mode == 2) take = len >= 3 && len < 110 && s[0] == '(' && strchr(s, ')') && !strchr(s, ' ');
              if (take) {
                for (k = 0; k < nseen; k++) if (strcmp(seen[k], s) == 0) break;
                if (k == nseen) { seen[nseen++] = s; P("  %s\n", s); }
              }
              i = j + 1;
            }
            P("  (%d string)\n", nseen);
          }

          int main(int argc, char **argv) {
            Lib unity, mono;
            struct utsname u;
            int i, njni = 0;
            static const char *p_gl1[] = { "/usr/lib32/libGLESv1_CM.so.1", "/usr/lib32/libGLESv1_CM.so", "/lib32/libGLESv1_CM.so.1", "libGLESv1_CM.so.1", NULL };
            static const char *p_gl2[] = { "/usr/lib32/libGLESv2.so.2", "/usr/lib32/libGLESv2.so", "/lib32/libGLESv2.so.2", "libGLESv2.so.2", NULL };
            static const char *p_mali[] = { "/usr/lib32/libmali.so", "/usr/lib32/libmali.so.1", "/lib32/libmali.so", NULL };
            static const char *p_egl[] = { "/usr/lib32/libEGL.so.1", "/usr/lib32/libEGL.so", "/lib32/libEGL.so.1", "libEGL.so.1", NULL };
            static const char *p_g4[] = { "/usr/lib32/gl4es/libGL.so.1", "/usr/lib32/libGL.so.1", "/lib32/gl4es/libGL.so.1", NULL };

            if (argc < 3) { fprintf(stderr, "pakai: %s libunity.so libmono.so [report.txt]\n", argv[0]); return 2; }
            if (argc > 3) rep = fopen(argv[3], "w");

            P("== elfprobe (Cordy Android / Unity 3.5.4f1, Milestone 1) ==\n");
            if (uname(&u) == 0) P("device: %s %s %s\n", u.sysname, u.release, u.machine);
            P("glibc: %s\n", gnu_get_libc_version());

            /* muat runtime umum supaya dlsym(RTLD_DEFAULT) mewakili apa yang tersedia untuk game */
            dlopen("libm.so.6", RTLD_NOW | RTLD_GLOBAL);
            dlopen("libgcc_s.so.1", RTLD_NOW | RTLD_GLOBAL);
            dlopen("libstdc++.so.6", RTLD_NOW | RTLD_GLOBAL);
            dlopen("libz.so.1", RTLD_NOW | RTLD_GLOBAL);

            P("\n== library grafik 32-bit di device ==\n");
            h_gl1 = try_any("libGLESv1_CM", p_gl1);
            h_gl2 = try_any("libGLESv2", p_gl2);
            h_mali = try_any("libmali", p_mali);
            h_egl = try_any("libEGL", p_egl);
            h_gl4es = try_any("gl4es libGL", p_g4);
            if (h_egl) P("  eglGetProcAddress: %s | eglGetDisplay: %s\n",
                         dlsym(h_egl, "eglGetProcAddress") ? "ada" : "TIDAK", dlsym(h_egl, "eglGetDisplay") ? "ada" : "TIDAK");
            P("  libz.so.1 (Unity impor inflate/deflate/crc32): %s\n", dlsym(RTLD_DEFAULT, "inflate") ? "ada" : "TIDAK ADA");

            P("\n== libunity.so ==\n");
            if (load_lib(argv[1], &unity) != 0) return 1;
            print_needed(&unity);
            print_loader_info(&unity);
            for (i = 1; i < unity.nsym; i++) {
              const Elf32_Sym *s = &unity.sym[i];
              const char *n;
              if (s->st_shndx == SHN_UNDEF || !s->st_name) continue;
              n = unity.str + s->st_name;
              if (strncmp(n, "Java_", 5) == 0 || strcmp(n, "JNI_OnLoad") == 0) { njni++; P("  ekspor JNI: %s\n", n); }
            }
            P("  titik masuk JNI terekspor: %d\n", njni);

            P("\n== libmono.so ==\n");
            if (load_lib(argv[2], &mono) != 0) return 1;
            print_needed(&mono);
            print_loader_info(&mono);
            P("  simbol terekspor: %d\n", mono.nsym - 1);

            classify(&unity, &mono, "libunity.so", "libmono");
            classify(&mono, NULL, "libmono.so", "-");
            gl_report(&unity);

            P("\n=== petunjuk untuk JNI palsu / pengganti UnityPlayer.java (M2) ===\n");
            scan_strings(&unity, "nama kelas Java yang disebut libunity", 0, 120);
            scan_strings(&unity, "nama method native (kandidat tabel RegisterNatives)", 1, 120);
            scan_strings(&unity, "signature JNI (kandidat GetMethodID/RegisterNatives)", 2, 150);

            P("\n== selesai ==\n");
            if (rep) fclose(rep);
            return 0;
          }
          EOF_C1
          cat > out/CordyProbe.sh <<'EOF_SH'
          #!/bin/bash
          # Probe Cordy Android (Milestone 1). Hanya membaca, tidak mengubah apa pun.
          # Folder data dicari seperti launcher PortMaster lain: /$directory/ports/<nama>

          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}

          if [ -d "/opt/system/Tools/PortMaster/" ]; then
            controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster/" ]; then
            controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster/" ]; then
            controlfolder="$XDG_DATA_HOME/PortMaster"
          else
            controlfolder="/roms/ports/PortMaster"
          fi

          source $controlfolder/control.txt
          [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"

          GAMEDIR="/$directory/ports/cordy_android"
          [ -d "$GAMEDIR" ] || GAMEDIR="$(cd "$(dirname "$0")" && pwd)/cordy_android"

          cd "$GAMEDIR" || {
            echo "folder cordy_android tidak ketemu. Dicari di: /$directory/ports/cordy_android dan di sebelah script ini." > "$(dirname "$0")/probe_error.txt"
            exit 1
          }

          export LD_LIBRARY_PATH="/usr/lib32:/lib32:${LD_LIBRARY_PATH}"
          chmod +x ./elfprobe 2>/dev/null

          echo "GAMEDIR=$GAMEDIR" > probe_stdout.txt
          if [ ! -f libs/libunity.so ] || [ ! -f libs/libmono.so ]; then
            echo "libs/libunity.so dan libs/libmono.so belum ada di $GAMEDIR/libs" > probe_report.txt
            sleep 3
            exit 1
          fi

          ./elfprobe libs/libunity.so libs/libmono.so probe_report.txt >> probe_stdout.txt 2>&1
          echo "exit code: $?" >> probe_stdout.txt
          sleep 2
          type pm_finish >/dev/null 2>&1 && pm_finish
          EOF_SH
          bash -n out/CordyProbe.sh
          echo "Taruh libunity.so dan libmono.so di folder ini. AMBIL DARI assets/libs/armeabi-v7a/ di dalam APK (ukuran 6,8 MB dan 3,8 MB), BUKAN dari lib/armeabi-v7a/ (itu cuma stub proxy 43 KB / 84 KB). Jangan di-upload ke GitHub." > out/cordy_android/libs/TARUH-LIB-DI-SINI.txt

      - name: Kompilasi (armhf)
        run: |
          arm-linux-gnueabihf-gcc -O2 -Wall -Wextra -Wno-missing-field-initializers -o out/cordy_android/elfprobe src/elfprobe.c -ldl
          file out/cordy_android/elfprobe || true
          echo "--- library yang dibutuhkan:"
          arm-linux-gnueabihf-readelf -d out/cordy_android/elfprobe | grep NEEDED
          MAXV=$(arm-linux-gnueabihf-readelf -V out/cordy_android/elfprobe | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "elfprobe butuh GLIBC tertinggi: $MAXV (device: 2.37)"
          if [ "$(printf '%s\n%s\n' 2.37 "$MAXV" | sort -V | tail -1)" != "2.37" ]; then
            echo "GAGAL: elfprobe butuh glibc lebih baru dari 2.37. Simbol penyebab:"
            arm-linux-gnueabihf-nm -D --undefined-only out/cordy_android/elfprobe | grep -E 'GLIBC_2\.(3[89]|[4-9][0-9])'
            exit 1
          fi

      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: cordy-probe-armhf
          path: out
