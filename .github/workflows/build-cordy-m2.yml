          /* --- open(): FMOD Ex membaca /proc/cpuinfo untuk cari "vfp"/"neon" di baris Features. Kernel aarch64 tidak
           * menampilkannya -> FMOD kira CPU tanpa VFP/NEON -> getNumDrivers = FMOD_ERR_NEEDSHARDWARE -> "Sound disabled".
           * Solusi: kasih cpuinfo palsu bergaya ARMv7 (memfd). --- */
          static int b_open(const char *path, int flags, ...) {
            mode_t mode = 0;
            if (flags & (O_CREAT | 020000000 /* O_TMPFILE */)) { va_list ap; va_start(ap, flags); mode = (mode_t)va_arg(ap, unsigned int); va_end(ap); }
            if (path && strcmp(path, "/proc/cpuinfo") == 0) {
              static const char fake[] =
                "Processor\t: ARMv7 Processor rev 4 (v7l)\n"
                "processor\t: 0\nBogoMIPS\t: 48.00\n"
                "Features\t: half thumb fastmult vfp edsp neon vfpv3 tls vfpv4 idiva idivt vfpd32 lpae\n"
                "CPU implementer\t: 0x41\nCPU architecture: 7\nCPU variant\t: 0x0\nCPU part\t: 0xc07\nCPU revision\t: 4\n\n"
                "Hardware\t: Luxor-Loader\nRevision\t: 0000\nSerial\t\t: 0000000000000000\n";
              int fd = memfd_create("cpuinfo", 0);
              if (fd >= 0) {
                if (write(fd, fake, sizeof fake - 1) == (ssize_t)(sizeof fake - 1) && lseek(fd, 0, SEEK_SET) == 0) {
                  L("[shim] open(/proc/cpuinfo) -> cpuinfo ARMv7 palsu (vfp/neon) supaya FMOD mau pakai software mixer\n");
                  return fd;
                }
                close(fd);
              }
            }
            return open(path, flags, mode);
          }

