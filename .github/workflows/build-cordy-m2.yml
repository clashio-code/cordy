          /* unwinder EHABI: cari tabel exidx modul yang memuat pc */
          static uintptr_t b_find_exidx(uintptr_t pc, int *pcount) {
            int i;
            for (i = 0; i < nmods; i++) {
              Mod *m = &mods[i];
              if (pc >= (uintptr_t)m->base && pc < (uintptr_t)m->base + m->span) {
                const Elf32_Ehdr *eh = (const Elf32_Ehdr *)m->file;
                const Elf32_Phdr *ph = (const Elf32_Phdr *)(m->file + eh->e_phoff);
                int k;
                for (k = 0; k < eh->e_phnum; k++) if (ph[k].p_type == 0x70000001u) { *pcount = (int)(ph[k].p_memsz / 8); return m->bias + ph[k].p_vaddr; }
              }
            }
            *pcount = 0; return 0;
          }

