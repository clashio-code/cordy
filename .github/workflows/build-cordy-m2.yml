          static void *b_dlsym(void *h, const char *s) {
            int i; void *p;
            if (h == &g_dl_main || h == NULL) {
              for (i = 0; i < nmods; i++) if ((p = mod_find(&mods[i], s))) return p;
              return dlsym(RTLD_DEFAULT, s);
            }
            if ((Mod *)h >= &mods[0] && (Mod *)h < &mods[MAXMOD]) return mod_find((Mod *)h, s);
            return dlsym(h, s);
