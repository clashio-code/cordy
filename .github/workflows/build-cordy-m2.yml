          static void *b_dlopen(const char *n, int fl) {
            int i;
            L("[shim] dlopen(\"%s\")\n", n ? n : "(null)");
            if (!n) return &g_dl_main;
            for (i = 0; i < nmods; i++) if (strstr(n, mods[i].name)) return &mods[i];
            return dlopen(n, fl ? fl : RTLD_LAZY);
