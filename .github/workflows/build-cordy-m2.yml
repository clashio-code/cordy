          /* SHA1 gaya BSD (libc bionic): SHA1Init/Update/Final */
          typedef struct { uint32_t state[5]; uint32_t count[2]; uint8_t buffer[64]; } BSha1;
          #define ROL(v, b) (((v) << (b)) | ((v) >> (32 - (b))))
          static void sha1_tr(uint32_t st[5], const uint8_t *p) {
            uint32_t w[80], a, b, c, d, e, t; int i;
            for (i = 0; i < 16; i++) w[i] = ((uint32_t)p[i*4] << 24) | ((uint32_t)p[i*4+1] << 16) | ((uint32_t)p[i*4+2] << 8) | p[i*4+3];
            for (i = 16; i < 80; i++) w[i] = ROL(w[i-3] ^ w[i-8] ^ w[i-14] ^ w[i-16], 1);
            a = st[0]; b = st[1]; c = st[2]; d = st[3]; e = st[4];
            for (i = 0; i < 80; i++) {
              uint32_t f, k;
              if (i < 20) { f = (b & c) | (~b & d); k = 0x5A827999u; }
              else if (i < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1u; }
              else if (i < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDCu; }
              else { f = b ^ c ^ d; k = 0xCA62C1D6u; }
              t = ROL(a, 5) + f + e + k + w[i]; e = d; d = c; c = ROL(b, 30); b = a; a = t;
            }
            st[0] += a; st[1] += b; st[2] += c; st[3] += d; st[4] += e;
          }
          static void b_SHA1Init(BSha1 *c) { c->state[0] = 0x67452301u; c->state[1] = 0xEFCDAB89u; c->state[2] = 0x98BADCFEu; c->state[3] = 0x10325476u; c->state[4] = 0xC3D2E1F0u; c->count[0] = c->count[1] = 0; }
          static void b_SHA1Update(BSha1 *c, const uint8_t *d, unsigned len) {
            unsigned i, j = (c->count[0] >> 3) & 63;
            if ((c->count[0] += len << 3) < (len << 3)) c->count[1]++;
            c->count[1] += len >> 29;
            if (j + len > 63) {
              memcpy(&c->buffer[j], d, (i = 64 - j)); sha1_tr(c->state, c->buffer);
              for (; i + 63 < len; i += 64) sha1_tr(c->state, &d[i]);
              j = 0;
            } else i = 0;
            memcpy(&c->buffer[j], &d[i], len - i);
          }
          static void b_SHA1Final(uint8_t dig[20], BSha1 *c) {
            uint8_t fc[8], pad = 0x80, z = 0; int i;
            for (i = 0; i < 8; i++) fc[i] = (uint8_t)((c->count[(i >= 4) ? 0 : 1] >> ((3 - (i & 3)) * 8)) & 255);
            b_SHA1Update(c, &pad, 1);
            while ((c->count[0] & 504) != 448) b_SHA1Update(c, &z, 1);
            b_SHA1Update(c, fc, 8);
            for (i = 0; i < 20; i++) dig[i] = (uint8_t)((c->state[i >> 2] >> ((3 - (i & 3)) * 8)) & 255);
          }

