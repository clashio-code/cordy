            int r;
            if (a) { pthread_attr_getstacksize(a, &sz); if (sz < (1u << 20)) pthread_attr_setstacksize(a, 1u << 20); }
            if (nlog++ < 20) L("[thr] pthread_create fn=%p stack_diminta=%u -> min 1MB\n", (void *)fn, (unsigned)sz);
