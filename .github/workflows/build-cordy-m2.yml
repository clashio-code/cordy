name: build-armhf-cordy-m2
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pasang toolchain ARM 32-bit
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Tulis sumber
        run: |
          mkdir -p src out/cordy_android/libs
          cat > src/cordyloader.c <<'EOF_C2'
          /* cordyloader - Milestone 2 port Cordy (Unity 3.5.4f1, Android armeabi-v7a) ke armhf / muOS.
           * Memuat libmono.so + libunity.so (ELF32 ARM, bionic) SENDIRI tanpa dlopen, memetakan impor ke shim bionic->glibc,
           * menyediakan JNI palsu, menjalankan konstruktor + JNI_OnLoad, lalu MENCATAT tabel RegisterNatives milik UnityPlayer.
           * Dasar kode: luxorloader (sudah terbukti jalan di RG40XXV).
           * Pakai: cordyloader <folder-libs> [--dry] [--apk cordy.apk] [--stage N] [--timeout detik]
           *   stage 2 (default) = konstruktor + JNI_OnLoad ; stage 3 = + nativeFile(apk) jika signature cocok. */
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdarg.h>
          #include <setjmp.h>
          #include <math.h>
          #include <time.h>
          #include <errno.h>
          #include <elf.h>
          #include <dlfcn.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <signal.h>
          #include <ucontext.h>
          #include <pthread.h>
          #include <semaphore.h>
          #include <dirent.h>
          #include <sys/mman.h>
          #include <sys/stat.h>
          #include <sys/utsname.h>
          #include <gnu/libc-version.h>

          #pragma GCC diagnostic ignored "-Wdeprecated-declarations"
          #define PAGE 4096u
          #define MAXMOD 4
          #define MAXUNRES 64
          #define U32(p) ((uint32_t)(uintptr_t)(p))
          /* Library Android armeabi-v7a memakai ABI softfp (float/double lewat r0-r3), sedangkan proses ini hard-float.
           * Semua fungsi FP yang dipanggil game ATAU yang dipanggil-balik ke game harus memakai "aapcs" dasar. */
          #ifdef __arm__
          #define AAPCS __attribute__((pcs("aapcs")))
          #else
          #define AAPCS
          #endif

          static FILE *g_log;

          static void L(const char *fmt, ...) {
            va_list ap;
            va_start(ap, fmt); vfprintf(stdout, fmt, ap); va_end(ap); fflush(stdout);
            if (g_log) { va_start(ap, fmt); vfprintf(g_log, fmt, ap); va_end(ap); fflush(g_log); }
          }

          /* ======================= modul ELF ======================= */
          typedef struct {
            char name[64];
            uint8_t *file; size_t fsize;
            uint8_t *base; size_t span; uintptr_t bias;
            Elf32_Sym *sym; int nsym; const char *str;
            Elf32_Rel *rel; uint32_t nrel; Elf32_Rel *jrel; uint32_t njrel;
            uint32_t init; uint32_t *iarr; uint32_t niarr;
          } Mod;

          static Mod mods[MAXMOD];
          static int nmods;

          static const char *unres_name[MAXUNRES];
          static int nunres;
          static const char *shim_hit[256];
          static int nshim_hit;
          static int cnt_self, cnt_mod, cnt_shim, cnt_libc, cnt_gl, cnt_unres, cnt_weak0;
          static void *h_gles, *h_egl;

          static int trap_unres(int i);
          static int jni_trap(int i);
          #include "stubs.inc"

          static int trap_unres(int i) {
            L("\n*** PANGGILAN KE SIMBOL TAK TERSELESAIKAN: %s ***\n", (i >= 0 && i < nunres) ? unres_name[i] : "?");
            _exit(3);
            return 0;
          }

          /* nama fungsi (dynsym) terdekat di modul game untuk alamat a */
          static const char *game_sym(const Mod *m, uintptr_t a, uint32_t *delta) {
            uint32_t off = (uint32_t)(a - m->bias), best = 0; const char *nm = NULL; int i;
            for (i = 1; i < m->nsym; i++) {
              const Elf32_Sym *y = &m->sym[i];
              if (y->st_shndx == SHN_UNDEF || !y->st_name || ELF32_ST_TYPE(y->st_info) != STT_FUNC) continue;
              if ((y->st_value & ~1u) <= off && (y->st_value & ~1u) >= best) { best = y->st_value & ~1u; nm = m->str + y->st_name; }
            }
            *delta = off - best;
            return nm;
          }
          static void describe(uintptr_t a) {
            int i;
            for (i = 0; i < nmods; i++)
              if (a >= (uintptr_t)mods[i].base && a < (uintptr_t)mods[i].base + mods[i].span) {
                uint32_t d = 0; const char *nm = game_sym(&mods[i], a, &d);
                L("    -> %s + 0x%x  [%s+0x%x]\n", mods[i].name, (unsigned)(a - mods[i].bias), nm ? nm : "?", (unsigned)d);
              }
          }

          /* jejak pemanggil di kode game: pindai stack, ambil nilai yang jatuh di modul game DAN didahului instruksi panggilan (bl / mov lr,pc) */
          static void print_game_trace(const char *why) {
          #if defined(__arm__)
            const uintptr_t *sp = (const uintptr_t *)__builtin_frame_address(0);
            int k, shown = 0;
            L("  [trace] %s (return address game di stack, terdekat dulu):\n", why);
            for (k = 0; k < 4096 && shown < 40; k++) {
              uintptr_t v = sp[k]; int i;
              for (i = 0; i < nmods; i++) {
                if (v >= (uintptr_t)mods[i].base + 8 && v < (uintptr_t)mods[i].base + mods[i].span && (v & 3u) == 0) {
                  uint32_t p1 = *(const uint32_t *)(v - 4), p2 = *(const uint32_t *)(v - 8);
                  int call = ((p1 >> 24) == 0xebu) || ((p1 & 0xfffffff0u) == 0xe12fff30u) || (p2 == 0xe1a0e00fu);
                  if (call) {
                    uint32_t d = 0; const char *nm = game_sym(&mods[i], v, &d);
                    L("    #%d sp+%d: %s + 0x%x  [%s+0x%x]\n", shown, k * 4, mods[i].name, (unsigned)(v - mods[i].bias), nm ? nm : "?", (unsigned)d);
                    shown++;
                  }
                  break;
                }
              }
            }
          #else
            (void)why;
          #endif
          }

          /* cetak baris /proc/self/maps yang memuat alamat a (nama library sistem tempat crash) */
          static void map_of(const char *tag, uintptr_t a) {
            FILE *m = fopen("/proc/self/maps", "r");
            char ln[512];
            if (!m) return;
            while (fgets(ln, sizeof ln, m)) {
              unsigned long lo, hi;
              const char *q = ln; lo = 0; hi = 0;
              /* parse hex manual: sscanf/strtoul di glibc build >=2.38 terikat ke simbol GLIBC_2.38, device cuma 2.37 */
              while ((*q >= '0' && *q <= '9') || (*q >= 'a' && *q <= 'f')) lo = lo * 16 + (unsigned long)(*q <= '9' ? *q - '0' : *q - 'a' + 10), q++;
              if (*q == '-') q++;
              while ((*q >= '0' && *q <= '9') || (*q >= 'a' && *q <= 'f')) hi = hi * 16 + (unsigned long)(*q <= '9' ? *q - '0' : *q - 'a' + 10), q++;
              if (hi && a >= lo && a < hi) {
                char *nl = strchr(ln, '\n'); if (nl) *nl = 0;
                L("    %s in map: %s  (offset di map = 0x%lx)\n", tag, ln, (unsigned long)(a - lo));
                break;
              }
            }
            fclose(m);
          }
          #if defined(__arm__)
          /* Breakpoint perangkat lunak: ganti "cmp r0,#0" (setelah panggilan) dengan UDF, tangani SIGILL, catat r0, emulasikan flag. */
          typedef struct { uintptr_t addr; uint32_t orig; const char *tag; } Bp;
          static Bp g_bp[16]; static int g_nbp, g_bp_hits;
          static void bp_add(uintptr_t a, const char *tag) {
            uintptr_t pg = a & ~(uintptr_t)(PAGE - 1);
            if (g_nbp >= 16 || *(uint32_t *)a != 0xe3500000u) { L("[bp] lewati %s (instruksi bukan cmp r0,#0)\n", tag); return; }
            if (mprotect((void *)pg, 2 * PAGE, PROT_READ | PROT_WRITE | PROT_EXEC) != 0) return;
            g_bp[g_nbp].addr = a; g_bp[g_nbp].orig = *(uint32_t *)a; g_bp[g_nbp].tag = tag;
            *(uint32_t *)a = 0xe7f000f0u;
            __builtin___clear_cache((char *)a, (char *)a + 4);
            mprotect((void *)pg, 2 * PAGE, PROT_READ | PROT_EXEC);
            g_nbp++;
          }
          static int bp_handle(ucontext_t *uc) {
            uintptr_t pc = uc->uc_mcontext.arm_pc; int i;
            for (i = 0; i < g_nbp; i++) if (g_bp[i].addr == pc) {
              int32_t r0 = (int32_t)uc->uc_mcontext.arm_r0;
              unsigned long cp = uc->uc_mcontext.arm_cpsr & 0x0fffffffUL;
              if (r0 < 0) cp |= 1UL << 31;
              if (r0 == 0) cp |= 1UL << 30;
              cp |= 1UL << 29;
              uc->uc_mcontext.arm_cpsr = cp;
              uc->uc_mcontext.arm_pc = pc + 4;
              if (g_bp_hits++ < 300) L("[bp] %s: r0=%d (0x%x)\n", g_bp[i].tag, (int)r0, (unsigned)r0);
              return 1;
            }
            return 0;
          }
          #endif
          static void on_sig(int sig, siginfo_t *si, void *ctx) {
            ucontext_t *uc = (ucontext_t *)ctx;
            uintptr_t pc = 0, lr = 0;
          #if defined(__arm__)
            pc = uc->uc_mcontext.arm_pc; lr = uc->uc_mcontext.arm_lr;
          #elif defined(__x86_64__)
            pc = (uintptr_t)uc->uc_mcontext.gregs[REG_RIP];
          #endif
          #if defined(__arm__)
            if (sig == SIGILL && bp_handle(uc)) return;
          #endif
            L("\n*** SINYAL %d  addr=%p  pc=%p  lr=%p ***\n", sig, si->si_addr, (void *)pc, (void *)lr);
            describe(pc); describe(lr);
            map_of("pc", pc); map_of("lr", lr);
            { FILE *m = fopen("/proc/self/maps", "r"); char ln[512]; int cnt = 0;
              if (m) { L("  [peta r-x]\n"); while (fgets(ln, sizeof ln, m) && cnt < 60) if (strstr(ln, "r-xp") || strstr(ln, "rwxp")) { L("    %s", ln); cnt++; } fclose(m); } }
          #if defined(__arm__)
            L("    r0=%08lx r1=%08lx r2=%08lx r3=%08lx r4=%08lx r5=%08lx r6=%08lx r7=%08lx\n",
              uc->uc_mcontext.arm_r0, uc->uc_mcontext.arm_r1, uc->uc_mcontext.arm_r2, uc->uc_mcontext.arm_r3,
              uc->uc_mcontext.arm_r4, uc->uc_mcontext.arm_r5, uc->uc_mcontext.arm_r6, uc->uc_mcontext.arm_r7);
            L("    r8=%08lx r9=%08lx r10=%08lx fp=%08lx ip=%08lx sp=%08lx\n",
              uc->uc_mcontext.arm_r8, uc->uc_mcontext.arm_r9, uc->uc_mcontext.arm_r10, uc->uc_mcontext.arm_fp,
              uc->uc_mcontext.arm_ip, uc->uc_mcontext.arm_sp);
            {
              Dl_info di; int k;
              if (dladdr((void *)pc, &di)) L("  [dladdr pc] %s : %s (+0x%x)\n", di.dli_fname ? di.dli_fname : "?", di.dli_sname ? di.dli_sname : "(tak ada simbol ekspor)", di.dli_saddr ? (unsigned)(pc - (uintptr_t)di.dli_saddr) : 0u);
              if (dladdr((void *)lr, &di)) L("  [dladdr lr] %s : %s (+0x%x)\n", di.dli_fname ? di.dli_fname : "?", di.dli_sname ? di.dli_sname : "(tak ada simbol ekspor)", di.dli_saddr ? (unsigned)(lr - (uintptr_t)di.dli_saddr) : 0u);
              /* dump byte kode di sekitar pc supaya bisa didisassemble offline (ARM/Thumb) */
              {
                const uint8_t *c = (const uint8_t *)((pc & ~1u) - 96);
                L("  [code] 96 byte sebelum + 32 byte sesudah pc (mulai %p):", (const void *)c);
                for (k = 0; k < 128; k++) { if (k % 32 == 0) L("\n   "); L("%02x", c[k]); }
                L("\n");
              }
              /* stack mentah 40 kata pertama */
              {
                const uintptr_t *sp = (const uintptr_t *)uc->uc_mcontext.arm_sp;
                L("  [stack mentah]");
                for (k = 0; k < 40; k++) { if (k % 4 == 0) L("\n   sp+%03d:", k * 4); L(" %08x", (unsigned)sp[k]); }
                L("\n");
              }
            }
            {
              /* backtrace kasar: pindai 2048 byte stack, tampilkan nilai yang jatuh di dalam libmain/libfmodex */
              const uintptr_t *sp = (const uintptr_t *)uc->uc_mcontext.arm_sp;
              int k, shown = 0;
              L("  [stack] kandidat return address di game (bisa sisa lama):\n");
              for (k = 0; k < 512 && shown < 16; k++) {
                int i;
                for (i = 0; i < nmods; i++)
                  if (sp[k] >= (uintptr_t)mods[i].base && sp[k] < (uintptr_t)mods[i].base + mods[i].span) {
                    uint32_t d = 0; const char *nm = game_sym(&mods[i], sp[k], &d);
                    L("    sp+%d: %s + 0x%x  [%s+0x%x]\n", k * 4, mods[i].name, (unsigned)(sp[k] - mods[i].bias), nm ? nm : "?", (unsigned)d); shown++; break;
                  }
              }
            }
          #endif
            _exit(128 + sig);
          }

          /* ======================= shim bionic -> glibc ======================= */
          /* --- ctype / stdio bionic --- */
          static char bionic_ctype[1 + 256];
          static int16_t bionic_tolower[1 + 256], bionic_toupper[1 + 256];
          /* bionic: _tolower_tab_/_toupper_tab_ adalah VARIABEL POINTER (const short *), bukan array. Kode game: ldr r1,[sym]; ldrsh [r1+2c+2]. */
          static const int16_t *p_tolower = bionic_tolower, *p_toupper = bionic_toupper;
          /* _ctype_ lama bionic juga POINTER (const char *): kode game: ldr r2,[sym]; ldrb [r2+c+1] (terlihat di gvFile::_validName) */
          static const char *p_ctype = bionic_ctype;
          static char bionic_sF[3 * 84];

          static void init_tables(void) {
            int c;
            bionic_ctype[0] = 0; bionic_tolower[0] = -1; bionic_toupper[0] = -1;
            for (c = 0; c < 256; c++) {
              unsigned f = 0;
              if (c < 128) {
                if (c >= 'A' && c <= 'Z') f |= 0x01;
                if (c >= 'a' && c <= 'z') f |= 0x02;
                if (c >= '0' && c <= '9') f |= 0x04;
                if (c == ' ' || (c >= 9 && c <= 13)) f |= 0x08;
                if ((c > 32 && c < 127) && !((c >= 'A' && c <= 'Z') || (c >= 'a' && c <= 'z') || (c >= '0' && c <= '9'))) f |= 0x10;
                if (c < 32 || c == 127) f |= 0x20;
                if ((c >= '0' && c <= '9') || (c >= 'A' && c <= 'F') || (c >= 'a' && c <= 'f')) f |= 0x40;
                if (c == ' ') f |= 0x80;
              }
              bionic_ctype[1 + c] = (char)f;
              bionic_tolower[1 + c] = (int16_t)((c >= 'A' && c <= 'Z') ? c + 32 : c);
              bionic_toupper[1 + c] = (int16_t)((c >= 'a' && c <= 'z') ? c - 32 : c);
            }
          }

          static FILE *xf(FILE *f) {
            uintptr_t a = (uintptr_t)f, b = (uintptr_t)bionic_sF;
            if (a >= b && a < b + sizeof bionic_sF) { unsigned i = (unsigned)((a - b) / 84); return i == 0 ? stdin : i == 1 ? stdout : stderr; }
            return f;
          }
          static int b_fprintf(FILE *f, const char *fmt, ...) { va_list ap; int r; va_start(ap, fmt); r = vfprintf(xf(f), fmt, ap); va_end(ap); return r; }
          static int b_vfprintf(FILE *f, const char *fmt, va_list ap) { return vfprintf(xf(f), fmt, ap); }
          static int b_fputs(const char *s, FILE *f) { return fputs(s, xf(f)); }
          static int b_fputc(int c, FILE *f) { return fputc(c, xf(f)); }
          static size_t b_fwrite(const void *p, size_t s, size_t n, FILE *f) { return fwrite(p, s, n, xf(f)); }
          static size_t b_fread(void *p, size_t s, size_t n, FILE *f) { return fread(p, s, n, xf(f)); }
          static int b_fflush(FILE *f) { return fflush(xf(f)); }
          static char *b_fgets(char *s, int n, FILE *f) { return fgets(s, n, xf(f)); }
          static int b_fgetc(FILE *f) { return fgetc(xf(f)); }
          static int b_srget(FILE *f) { return fgetc(xf(f)); }
          static int b_swbuf(int c, FILE *f) { return fputc(c, xf(f)); }

          /* --- log / assert / misc bionic --- */
          static int *b_errno(void) { return &errno; }
          static int b_android_log_print(int prio, const char *tag, const char *fmt, ...) {
            char buf[1024]; va_list ap;
            va_start(ap, fmt); vsnprintf(buf, sizeof buf, fmt ? fmt : "", ap); va_end(ap);
            L("[droid %d/%s] %s\n", prio, tag ? tag : "?", buf);
            return 1;
          }
          static int b_android_log_write(int prio, const char *tag, const char *text) {
            L("[droid %d/%s] %s\n", prio, tag ? tag : "?", text ? text : "");
            return 1;
          }
          static void b_assert2(const char *file, int line, const char *func, const char *msg) {
            L("\n*** ASSERT bionic: %s:%d (%s): %s ***\n", file, line, func, msg);
            abort();
          }
          static int b_aeabi_atexit(void *obj, void (*dtor)(void *), void *dso) {
            extern int __cxa_atexit(void (*)(void *), void *, void *);
            return __cxa_atexit(dtor, obj, dso);
          }
          static void *b_register_frame_info(const void *a, void *b) { (void)a; (void)b; return NULL; }
          static void *b_deregister_frame_info(const void *a) { (void)a; return NULL; }
          static void b_jv_register(void *a) { (void)a; }
          static uint32_t b_stack_chk_guard = 0x00a4c3e1u;

          /* --- stat (layout stat bionic ARM32 = stat64 kernel) --- */
          static int b_stat(const char *p, void *b) { return stat64(p, (struct stat64 *)b); }
          static int b_fstat(int fd, void *b) { return fstat64(fd, (struct stat64 *)b); }
          static int b_lstat(const char *p, void *b) { return lstat64(p, (struct stat64 *)b); }

          /* --- pthread: objek bionic cuma 4 byte -> simpan pointer ke objek glibc asli (lazy) --- */
          static pthread_mutex_t g_initlock = PTHREAD_MUTEX_INITIALIZER;

          static pthread_mutex_t *mx_get(uint32_t *slot) {
            uint32_t v = __atomic_load_n(slot, __ATOMIC_ACQUIRE);
            if (v > 0xFFFFu) return (pthread_mutex_t *)(uintptr_t)v;
            pthread_mutex_lock(&g_initlock);
            v = *slot;
            if (v <= 0xFFFFu) {
              pthread_mutex_t *m = calloc(1, sizeof *m);
              pthread_mutexattr_t a;
              pthread_mutexattr_init(&a);
              if (v & 0x4000) pthread_mutexattr_settype(&a, PTHREAD_MUTEX_RECURSIVE);
              else if (v & 0x8000) pthread_mutexattr_settype(&a, PTHREAD_MUTEX_ERRORCHECK);
              pthread_mutex_init(m, &a); pthread_mutexattr_destroy(&a);
              v = U32(m);
              __atomic_store_n(slot, v, __ATOMIC_RELEASE);
            }
            pthread_mutex_unlock(&g_initlock);
            return (pthread_mutex_t *)(uintptr_t)v;
          }
          static int b_mutex_init(uint32_t *slot, const long *attr) {
            pthread_mutex_t *m = calloc(1, sizeof *m);
            pthread_mutexattr_t a;
            pthread_mutexattr_init(&a);
            if (attr && *attr == 1) pthread_mutexattr_settype(&a, PTHREAD_MUTEX_RECURSIVE);
            else if (attr && *attr == 2) pthread_mutexattr_settype(&a, PTHREAD_MUTEX_ERRORCHECK);
            pthread_mutex_init(m, &a); pthread_mutexattr_destroy(&a);
            *slot = U32(m);
            return 0;
          }
          static int b_mutex_destroy(uint32_t *slot) {
            if (*slot > 0xFFFFu) { pthread_mutex_t *m = (pthread_mutex_t *)(uintptr_t)*slot; pthread_mutex_destroy(m); free(m); }
            *slot = 0;
            return 0;
          }
          static int b_mutex_lock(uint32_t *s) { return pthread_mutex_lock(mx_get(s)); }
          static int b_mutex_unlock(uint32_t *s) { return pthread_mutex_unlock(mx_get(s)); }
          static int b_mutex_trylock(uint32_t *s) { return pthread_mutex_trylock(mx_get(s)); }
          static int b_mutexattr_init(long *a) { *a = 0; return 0; }
          static int b_mutexattr_settype(long *a, int t) { *a = t; return 0; }
          static int b_mutexattr_gettype(const long *a, int *t) { *t = (int)*a; return 0; }
          static int b_mutexattr_destroy(long *a) { (void)a; return 0; }

          static pthread_cond_t *cv_get(uint32_t *slot) {
            uint32_t v = __atomic_load_n(slot, __ATOMIC_ACQUIRE);
            if (v > 0xFFFFu) return (pthread_cond_t *)(uintptr_t)v;
            pthread_mutex_lock(&g_initlock);
            v = *slot;
            if (v <= 0xFFFFu) {
              pthread_cond_t *c = calloc(1, sizeof *c);
              pthread_cond_init(c, NULL);
              v = U32(c);
              __atomic_store_n(slot, v, __ATOMIC_RELEASE);
            }
            pthread_mutex_unlock(&g_initlock);
            return (pthread_cond_t *)(uintptr_t)v;
          }
          static int b_cond_init(uint32_t *slot, const void *attr) { pthread_cond_t *c = calloc(1, sizeof *c); (void)attr; pthread_cond_init(c, NULL); *slot = U32(c); return 0; }
          static int b_cond_destroy(uint32_t *slot) { if (*slot > 0xFFFFu) { pthread_cond_t *c = (pthread_cond_t *)(uintptr_t)*slot; pthread_cond_destroy(c); free(c); } *slot = 0; return 0; }
          static int b_cond_wait(uint32_t *c, uint32_t *m) { return pthread_cond_wait(cv_get(c), mx_get(m)); }
          static int b_cond_timedwait(uint32_t *c, uint32_t *m, const struct timespec *t) { return pthread_cond_timedwait(cv_get(c), mx_get(m), t); }
          static int b_cond_signal(uint32_t *c) { return pthread_cond_signal(cv_get(c)); }
          static int b_cond_broadcast(uint32_t *c) { return pthread_cond_broadcast(cv_get(c)); }
          static int b_condattr_init(long *a) { *a = 0; return 0; }
          static int b_condattr_destroy(long *a) { (void)a; return 0; }

