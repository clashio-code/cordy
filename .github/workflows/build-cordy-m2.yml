          /* ======================= JNI palsu (model objek sederhana + log panggilan Java) ======================= */
          typedef union { int32_t i; int64_t j; float f; double d; void *l; } jv;

          static const void *g_jni_table[256];
          static const void *g_vm_table[16];
          static const void *g_envobj = g_jni_table;
          static const void *g_vmobj = g_vm_table;
          static char *reg_str[4096];
          static int reg_n, obj_serial;
          static char g_apk[512];

          static void *mk_handle(const char *what, const char *s) {
            int i;
            (void)what;
            for (i = 0; i < reg_n; i++) if (strcmp(reg_str[i], s) == 0) return (void *)(uintptr_t)(0x70000000u + (uint32_t)i * 4u);
            if (reg_n >= 4096) return (void *)(uintptr_t)0x70000000u;
            reg_str[reg_n] = strdup(s);
            return (void *)(uintptr_t)(0x70000000u + (uint32_t)(reg_n++) * 4u);
          }
          static const char *h2s(void *h) {
            uintptr_t v = (uintptr_t)h;
            if (v >= 0x70000000u && ((v - 0x70000000u) / 4u) < (uintptr_t)reg_n) return reg_str[(v - 0x70000000u) / 4u];
            return "?";
          }
          static void *mk_obj(const char *cls) { char b[200]; snprintf(b, sizeof b, "obj:%s#%d", cls, ++obj_serial); return mk_handle("object", b); }

          typedef struct { char cls[96]; char name[64]; char sig[128]; int is_static; unsigned count; } MInfo;
          static MInfo minfo[512];
          static int nminfo;
          static int jlog_budget = 600;

          static void *mk_method(const char *cls, const char *name, const char *sig, int st) {
            int i;
            for (i = 0; i < nminfo; i++)
              if (!strcmp(minfo[i].cls, cls) && !strcmp(minfo[i].name, name) && !strcmp(minfo[i].sig, sig) && minfo[i].is_static == st)
                return (void *)(uintptr_t)(0x71000000u + (uint32_t)i * 4u);
            if (nminfo >= 512) i = 511; else i = nminfo++;
            snprintf(minfo[i].cls, sizeof minfo[i].cls, "%s", cls);
            snprintf(minfo[i].name, sizeof minfo[i].name, "%s", name);
            snprintf(minfo[i].sig, sizeof minfo[i].sig, "%s", sig);
            minfo[i].is_static = st; minfo[i].count = 0;
            L("[JNI] %s: %s.%s%s\n", st ? "GetStaticMethodID" : "GetMethodID", cls, name, sig);
            return (void *)(uintptr_t)(0x71000000u + (uint32_t)i * 4u);
          }
          static MInfo *mi_get(void *mid) {
            uintptr_t v = (uintptr_t)mid;
            if (v >= 0x71000000u && ((v - 0x71000000u) / 4u) < (uintptr_t)nminfo) return &minfo[(v - 0x71000000u) / 4u];
            return NULL;
          }

          /* ---- asset di dalam APK (Android: AssetFileDescriptor.getStartOffset/getLength; hanya valid untuk entri tanpa kompresi) ---- */
          static int apk_find(const char *apk, const char *entry, uint32_t *off, uint32_t *len, int *method) {
            FILE *f = fopen(apk, "rb");
            uint8_t tail[66000], *cd, lh[30];
            long fsz, tn, i, p = -1;
            uint32_t cdsz, cdoff, k, pos;
            unsigned ent, e;
            int found = -1;
            if (!f) return -1;
            fseek(f, 0, SEEK_END); fsz = ftell(f);
            tn = fsz < (long)sizeof tail ? fsz : (long)sizeof tail;
            fseek(f, fsz - tn, SEEK_SET);
            if (fread(tail, 1, (size_t)tn, f) != (size_t)tn) { fclose(f); return -1; }
            for (i = tn - 22; i >= 0; i--) if (tail[i] == 0x50 && tail[i+1] == 0x4b && tail[i+2] == 5 && tail[i+3] == 6) { p = i; break; }
            if (p < 0) { fclose(f); return -1; }
            ent = tail[p+10] | (tail[p+11] << 8);
            cdsz = tail[p+12] | (tail[p+13] << 8) | (tail[p+14] << 16) | ((uint32_t)tail[p+15] << 24);
            cdoff = tail[p+16] | (tail[p+17] << 8) | (tail[p+18] << 16) | ((uint32_t)tail[p+19] << 24);
            cd = malloc(cdsz);
            fseek(f, (long)cdoff, SEEK_SET);
            if (!cd || fread(cd, 1, cdsz, f) != cdsz) { free(cd); fclose(f); return -1; }
            for (e = 0, k = 0; e < ent && k + 46 <= cdsz; e++) {
              unsigned nl = cd[k+28] | (cd[k+29] << 8), el = cd[k+30] | (cd[k+31] << 8), cl = cd[k+32] | (cd[k+33] << 8);
              if (nl == strlen(entry) && memcmp(cd + k + 46, entry, nl) == 0) {
                uint32_t lho = cd[k+42] | (cd[k+43] << 8) | (cd[k+44] << 16) | ((uint32_t)cd[k+45] << 24);
                *method = cd[k+10] | (cd[k+11] << 8);
                *len = cd[k+24] | (cd[k+25] << 8) | (cd[k+26] << 16) | ((uint32_t)cd[k+27] << 24);
                fseek(f, (long)lho, SEEK_SET);
                if (fread(lh, 1, 30, f) == 30 && lh[0] == 0x50 && lh[1] == 0x4b && lh[2] == 3 && lh[3] == 4) {
                  pos = lho + 30 + (lh[26] | (lh[27] << 8)) + (lh[28] | (lh[29] << 8));
                  *off = pos; found = 0;
                }
                break;
              }
              k += 46 + nl + el + cl;
            }
            free(cd); fclose(f);
            return found;
          }

          /* ---- argumen varargs / jvalue ---- */
          static int sig_nargs(const char *sig) {
            const char *p = sig + 1; int n = 0;
            while (*p && *p != ')') {
              while (*p == '[') p++;
              if (*p == 'L') { while (*p && *p != ';') p++; }
              if (*p) p++;
              n++;
            }
            return n;
          }
          static int collect_va(const char *sig, va_list ap, jv *out) {
            const char *p = sig + 1; int n = 0;
            while (*p && *p != ')' && n < 16) {
              int arr = 0;
              memset(&out[n], 0, sizeof out[n]);
              while (*p == '[') { arr = 1; p++; }
              if (*p == 'L' || arr) {
                out[n].l = va_arg(ap, void *);
                if (*p == 'L') { while (*p && *p != ';') p++; }
              } else switch (*p) {
                case 'J': out[n].j = va_arg(ap, int64_t); break;
                case 'F': out[n].f = (float)va_arg(ap, double); break;
                case 'D': out[n].d = va_arg(ap, double); break;
                default: out[n].i = va_arg(ap, int); break;
              }
              if (*p) p++;
              n++;
            }
            return n;
          }
          static void fmt_args(const MInfo *m, const jv *a, char *buf, size_t sz) {
            const char *p = m->sig + 1; int n = 0; size_t o = 0;
            buf[0] = 0;
            while (*p && *p != ')' && n < 16 && o + 80 < sz) {
              int arr = 0;
              while (*p == '[') { arr = 1; p++; }
              if (*p == 'L' || arr) {
                const char *s = h2s(a[n].l);
                if (*s != '?' && strncmp(s, "obj:", 4) != 0) o += (size_t)snprintf(buf + o, sz - o, "\"%.60s\"", s);
                else o += (size_t)snprintf(buf + o, sz - o, "%p", a[n].l);
                if (*p == 'L') { while (*p && *p != ';') p++; }
              } else switch (*p) {
                case 'J': o += (size_t)snprintf(buf + o, sz - o, "%lld", (long long)a[n].j); break;
                case 'F': o += (size_t)snprintf(buf + o, sz - o, "%g", (double)a[n].f); break;
                case 'D': o += (size_t)snprintf(buf + o, sz - o, "%g", a[n].d); break;
                default: o += (size_t)snprintf(buf + o, sz - o, "%d", a[n].i); break;
              }
              if (*p) p++;
              n++;
              if (*p && *p != ')') o += (size_t)snprintf(buf + o, sz - o, ", ");
            }
          }

          /* Diagnostik: bongkar daftar entri arsip .mjz di dalam APK (header 16B: magic "MJZ0", jumlah entri di +8; tiap entri: 17B + nama[len=byte 16]) */
          static void mjz_dump(const char *ent, const char *want, int maxshow) {
            uint32_t off = 0, len = 0, cnt, i; int method = -1, shown = 0, hits = 0;
            unsigned char h[16], rec[17]; char nm[300]; FILE *f;
            if (apk_find(g_apk, ent, &off, &len, &method) != 0) { L("[mjz] %s: tidak ada di APK\n", ent); return; }
            f = fopen(g_apk, "rb");
            if (!f) { L("[mjz] gagal buka APK\n"); return; }
            if (fseek(f, (long)off, SEEK_SET) != 0 || fread(h, 1, 16, f) != 16) { L("[mjz] %s: gagal baca header\n", ent); fclose(f); return; }
            cnt = (uint32_t)h[8] | ((uint32_t)h[9] << 8) | ((uint32_t)h[10] << 16) | ((uint32_t)h[11] << 24);
            L("[mjz] %s: off=%u len=%u magic=%c%c%c%c hdr=%02x%02x%02x%02x %02x%02x%02x%02x %02x%02x%02x%02x %02x%02x%02x%02x entri=%u\n", ent, off, len,
              (h[0] >= 32 && h[0] < 127) ? h[0] : '?', (h[1] >= 32 && h[1] < 127) ? h[1] : '?', (h[2] >= 32 && h[2] < 127) ? h[2] : '?', (h[3] >= 32 && h[3] < 127) ? h[3] : '?',
              h[0], h[1], h[2], h[3], h[4], h[5], h[6], h[7], h[8], h[9], h[10], h[11], h[12], h[13], h[14], h[15], cnt);
            for (i = 0; i < cnt && i < 200000; i++) {
              unsigned nl;
              if (fread(rec, 1, 17, f) != 17) { L("[mjz] entri %u: baca record gagal\n", i); break; }
              nl = rec[16];
              if (nl >= sizeof nm || fread(nm, 1, nl, f) != nl) { L("[mjz] entri %u: nama gagal (len=%u)\n", i, nl); break; }
              nm[nl] = 0;
              if (shown < maxshow) { L("[mjz]   #%u \"%s\" rec=%02x%02x%02x%02x %02x%02x%02x%02x %02x%02x%02x%02x %02x%02x%02x%02x\n", i, nm,
                rec[0], rec[1], rec[2], rec[3], rec[4], rec[5], rec[6], rec[7], rec[8], rec[9], rec[10], rec[11], rec[12], rec[13], rec[14], rec[15]); shown++; }
              if (want && strcasestr(nm, want) && hits < 20) { hits++; L("[mjz]   COCOK \"%s\": #%u \"%s\"\n", want, i, nm); }
            }
            fclose(f);
          }

          static void java_invoke(void *mid, const jv *a, jv *r) {
            MInfo *m = mi_get(mid);
            const char *rp;
            char rt, args[400];
            memset(r, 0, sizeof *r);
            if (!m) { L("[Java] methodID tak dikenal: %p\n", mid); return; }
            rp = strchr(m->sig, ')');
            rt = rp ? rp[1] : 'V';
            m->count++;
            fmt_args(m, a, args, sizeof args);
            if (jlog_budget > 0 || m->count <= 3) { L("[Java] %s.%s(%s) -> %c\n", m->cls, m->name, args, rt); if (jlog_budget > 0) jlog_budget--; }
            if (!strcmp(m->name, "terminateActivity")) print_game_trace("terminateActivity dipanggil game");
            if (!strcmp(m->name, "getRawAssetFileOffset") || !strcmp(m->name, "getRawAssetFileLength")) {
              const char *arg = h2s(a[0].l);
              char ent[512]; uint32_t off = 0, len = 0; int method = -1;
              /* Absolute filesystem paths are not APK asset names. */
              if (arg[0] == '/') {
                struct stat st;
                if (stat(arg, &st) == 0) {
                  if (m->count <= 8) L("[asset] path filesystem ADA: %s (size=%lld); bukan entri APK, return 0 (game lalu fopen biasa)\n", arg, (long long)st.st_size);
                } else {
                  if (m->count <= 8) L("[asset] path filesystem TIDAK ADA: %s (errno=%d); bukan entri APK, return 0 (game lalu fopen biasa)\n", arg, errno);
                }
                r->j = 0; /* offset+panjang==0 => native pakai fopen(path) biasa; -1 dianggap entri APK di offset -1 */
              } else {
                snprintf(ent, sizeof ent, "assets/%s", arg);
                if (apk_find(g_apk, ent, &off, &len, &method) == 0) {
                  if (method != 0) L("[asset] PERINGATAN: %s terkompresi (method %d); native tidak bisa membaca langsung\n", ent, method);
                  r->j = !strcmp(m->name, "getRawAssetFileOffset") ? (int64_t)off : (int64_t)len;
                  if (m->count <= 5) L("[asset] %s -> offset=%u panjang=%u method=%d\n", ent, off, len, method);
                } else {
                  if (m->count <= 8) L("[asset] TIDAK ADA di APK (%s): %s\n", g_apk, ent);
                  r->j = 0;
                }
              }
            } else if (!strcmp(m->name, "getLanguageCode")) {
              r->l = mk_handle("string", "en");
            } else if (rt == 'L' && rp && !strcmp(rp + 1, "Ljava/lang/String;")) {
              r->l = mk_handle("string", "");
            }
          }

          #define PREP_VA(mid, ap, a) do { MInfo *mi_ = mi_get(mid); if (mi_) collect_va(mi_->sig, ap, a); } while (0)

          #define DEFCALL(NAME, CT, ATTR, CONV) \
            ATTR static CT j_Call##NAME##Method(void *env, void *o, void *mid, ...) { va_list ap; jv a[16], r; (void)env; (void)o; memset(a, 0, sizeof a); va_start(ap, mid); PREP_VA(mid, ap, a); va_end(ap); java_invoke(mid, a, &r); return CONV; } \
            ATTR static CT j_Call##NAME##MethodV(void *env, void *o, void *mid, va_list ap) { jv a[16], r; (void)env; (void)o; memset(a, 0, sizeof a); PREP_VA(mid, ap, a); java_invoke(mid, a, &r); return CONV; } \
            ATTR static CT j_Call##NAME##MethodA(void *env, void *o, void *mid, const jv *args) { jv r; (void)env; (void)o; java_invoke(mid, args, &r); return CONV; } \
            ATTR static CT j_CallStatic##NAME##Method(void *env, void *o, void *mid, ...) { va_list ap; jv a[16], r; (void)env; (void)o; memset(a, 0, sizeof a); va_start(ap, mid); PREP_VA(mid, ap, a); va_end(ap); java_invoke(mid, a, &r); return CONV; } \
            ATTR static CT j_CallStatic##NAME##MethodV(void *env, void *o, void *mid, va_list ap) { jv a[16], r; (void)env; (void)o; memset(a, 0, sizeof a); PREP_VA(mid, ap, a); java_invoke(mid, a, &r); return CONV; } \
            ATTR static CT j_CallStatic##NAME##MethodA(void *env, void *o, void *mid, const jv *args) { jv r; (void)env; (void)o; java_invoke(mid, args, &r); return CONV; }

          DEFCALL(Object, void *, , r.l)
          DEFCALL(Boolean, uint8_t, , (uint8_t)r.i)
          DEFCALL(Byte, int8_t, , (int8_t)r.i)
          DEFCALL(Char, uint16_t, , (uint16_t)r.i)
          DEFCALL(Short, int16_t, , (int16_t)r.i)
          DEFCALL(Int, int32_t, , r.i)
          DEFCALL(Long, int64_t, , r.j)
          DEFCALL(Float, float, AAPCS, r.f)
          DEFCALL(Double, double, AAPCS, r.d)

          #define DEFCALLV(NAME) \
            static void j_Call##NAME##Method(void *env, void *o, void *mid, ...) { va_list ap; jv a[16], r; (void)env; (void)o; memset(a, 0, sizeof a); va_start(ap, mid); PREP_VA(mid, ap, a); va_end(ap); java_invoke(mid, a, &r); } \
            static void j_Call##NAME##MethodV(void *env, void *o, void *mid, va_list ap) { jv a[16], r; (void)env; (void)o; memset(a, 0, sizeof a); PREP_VA(mid, ap, a); java_invoke(mid, a, &r); } \
            static void j_Call##NAME##MethodA(void *env, void *o, void *mid, const jv *args) { jv r; (void)env; (void)o; java_invoke(mid, args, &r); } \
            static void j_CallStatic##NAME##Method(void *env, void *o, void *mid, ...) { va_list ap; jv a[16], r; (void)env; (void)o; memset(a, 0, sizeof a); va_start(ap, mid); PREP_VA(mid, ap, a); va_end(ap); java_invoke(mid, a, &r); } \
            static void j_CallStatic##NAME##MethodV(void *env, void *o, void *mid, va_list ap) { jv a[16], r; (void)env; (void)o; memset(a, 0, sizeof a); PREP_VA(mid, ap, a); java_invoke(mid, a, &r); } \
            static void j_CallStatic##NAME##MethodA(void *env, void *o, void *mid, const jv *args) { jv r; (void)env; (void)o; java_invoke(mid, args, &r); }
          DEFCALLV(Void)

          static int jni_trap(int i) { L("[JNI] slot %d (%s) dipanggil, belum diimplementasi -> return 0\n", i, jni_names[i]); return 0; }

          static int j_GetVersion(void *env) { (void)env; return 0x00010006; }
          static void *j_FindClass(void *env, const char *n) { (void)env; L("[JNI] FindClass(\"%s\")\n", n); return mk_handle("class", n); }
          static void *j_GetObjectClass(void *env, void *o) {
            const char *s = h2s(o); char b[160]; const char *p, *q; (void)env;
            if (!strncmp(s, "obj:", 4)) { p = s + 4; q = strrchr(p, '#'); snprintf(b, sizeof b, "%.*s", q ? (int)(q - p) : (int)strlen(p), p); return mk_handle("class", b); }
            return mk_handle("class", "(object-class)");
