            for (i = 0; i < 4; i++) { len[i] = (uint8_t)(hi >> (24 - 8 * i)); len[4 + i] = (uint8_t)(lo >> (24 - 8 * i)); }
            b_SHA1Update(c, len, 8);
            for (i = 0; i < 20; i++) dig[i] = (uint8_t)(c->st[i >> 2] >> (24 - 8 * (i & 3)));
