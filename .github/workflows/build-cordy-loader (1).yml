            if (uname(&u) == 0) L("device: %s %s %s | glibc %s\n", u.sysname, u.release, u.machine, gnu_get_libc_version());
            L("libdir=%s stage=%d apk=%s timeout=%d\n", dir, stage, apk, timeout);

            ss.ss_sp = malloc(65536); ss.ss_size = 65536; ss.ss_flags = 0; sigaltstack(&ss, NULL);
            memset(&sa, 0, sizeof sa); sa.sa_sigaction = on_sig; sa.sa_flags = SA_SIGINFO | SA_ONSTACK;
            sigaction(SIGSEGV, &sa, NULL); sigaction(SIGBUS, &sa, NULL); sigaction(SIGILL, &sa, NULL); sigaction(SIGFPE, &sa, NULL); sigaction(SIGABRT, &sa, NULL);
            if (timeout > 0) { sa.sa_sigaction = on_alarm; sigaction(SIGALRM, &sa, NULL); alarm((unsigned)timeout); }

            dlopen("libm.so.6", RTLD_NOW | RTLD_GLOBAL); dlopen("libgcc_s.so.1", RTLD_NOW | RTLD_GLOBAL);
            dlopen("libstdc++.so.6", RTLD_NOW | RTLD_GLOBAL); dlopen("libz.so.1", RTLD_NOW | RTLD_GLOBAL);
            L("\n== library grafik 32-bit ==\n");
            h_gl1 = try_open("libGLESv1_CM", p_gl1); h_gl2 = try_open("libGLESv2", p_gl2);
            h_mali = try_open("libmali", p_mali); h_egl = try_open("libEGL", p_egl);
            init_ctype();

            L("\n== muat modul ==\n");
            if (load_mod(dir, "libmono.so", &mono) || load_mod(dir, "libunity.so", &unity)) { L("GAGAL memuat modul\n"); return 1; }
            L("\n== relokasi + resolusi simbol ==\n");
            if (relocate(mono) || relocate(unity)) { L("GAGAL relokasi\n"); return 1; }
            if (stub_pool) { mprotect(stub_pool, STUB_MAX * 16, PROT_READ | PROT_EXEC); __builtin___clear_cache((char *)stub_pool, (char *)stub_pool + STUB_MAX * 16); }
            protect_mod(mono); protect_mod(unity);
            L("resolusi: modul=%d shim=%d gl=%d glibc=%d TIDAK ADA=%d (stub jebakan terpasang)\n", g_kc[1], g_kc[2], g_kc[3], g_kc[4], g_kc[0]);
            L("\n-- simbol TIDAK ADA (%d) -> jebakan: loader berhenti jelas bila dipanggil\n", g_nunres);
            for (i = 0; i < g_nunres; i++) L("  %s\n", g_unres[i]);
            L("\n-- WARN-FP: impor dari libm yang lolos ke glibc TANPA wrapper softfp (%d) -> kandidat bug argumen float\n", g_nfp);
            for (i = 0; i < g_nfp; i++) L("  %s\n", g_fpwarn[i]);
            L("\n-- impor terkait C++ exception/unwind (%d) -> petunjuk apakah unwinder bawaan game dipakai\n", g_neh);
            for (i = 0; i < g_neh; i++) L("  %s\n", g_eh[i]);
            L("\n-- shim yang terpakai (%d)\n  ", g_nsh);
            for (i = 0; i < g_nsh; i++) L("%s%s", g_shimhit[i], (i % 6 == 5) ? "\n  " : " ");
            L("\n");
            if (stage < 1) { L("\n== STAGE 0 selesai (tidak ada kode game dijalankan) ==\n"); return 0; }

            L("\n== STAGE 1: konstruktor ==\n");
            run_ctors(mono); run_ctors(unity);
            if (stage < 2) { L("\n== STAGE 1 selesai ==\n"); return 0; }

            L("\n== STAGE 2: JNI_OnLoad ==\n");
            jni_setup();
            {
              int (*onload)(void *, void *) = (int (*)(void *, void *))mod_find(unity, "JNI_OnLoad");
              if (!onload) L("libunity tidak mengekspor JNI_OnLoad\n");
              else { int v = onload(&g_vm_p, NULL); L("JNI_OnLoad -> 0x%x\n", v); }
            }
            L("\nnative terdaftar: %d\n", nnat);
            {
              static const char *want[] = { "nativeInit", "nativeRender", "nativeResize", "nativePause", "nativeResume", "nativeTouch", "nativeFile", "nativeDone", "nativeRun", NULL };
              int k, j;
              for (k = 0; want[k]; k++) { int ok = 0; for (j = 0; j < nnat; j++) if (!strcmp(nats[j].name, want[k])) ok = 1; L("  %-14s : %s\n", want[k], ok ? "terdaftar" : "BELUM"); }
            }
            L("\n== STAGE 2 selesai. Stage 3 (EGL/GLES via SDL2 + nativeInit/nativeRender) belum ada ==\n");
            return 0;
          }
          EOF_C1
          cat > src/gen_stubs.py <<'EOF_PY'
          #!/usr/bin/env python3
          # Bangun stubs.inc: tabel 233 slot JNIEnv (nama + stub pencatat panggilan).
          T = ["Object", "Boolean", "Byte", "Char", "Short", "Int", "Long", "Float", "Double", "Void"]
          F = T[:9]
          P = ["Boolean", "Byte", "Char", "Short", "Int", "Long", "Float", "Double"]
          n = ["reserved0", "reserved1", "reserved2", "reserved3", "GetVersion", "DefineClass", "FindClass",
               "FromReflectedMethod", "FromReflectedField", "ToReflectedMethod", "GetSuperclass", "IsAssignableFrom",
               "ToReflectedField", "Throw", "ThrowNew", "ExceptionOccurred", "ExceptionDescribe", "ExceptionClear",
               "FatalError", "PushLocalFrame", "PopLocalFrame", "NewGlobalRef", "DeleteGlobalRef", "DeleteLocalRef",
               "IsSameObject", "NewLocalRef", "EnsureLocalCapacity", "AllocObject", "NewObject", "NewObjectV",
               "NewObjectA", "GetObjectClass", "IsInstanceOf", "GetMethodID"]
          for t in T:
              n += ["Call%sMethod" % t, "Call%sMethodV" % t, "Call%sMethodA" % t]
          for t in T:
              n += ["CallNonvirtual%sMethod" % t, "CallNonvirtual%sMethodV" % t, "CallNonvirtual%sMethodA" % t]
          n.append("GetFieldID")
          n += ["Get%sField" % t for t in F]
          n += ["Set%sField" % t for t in F]
          n.append("GetStaticMethodID")
          for t in T:
              n += ["CallStatic%sMethod" % t, "CallStatic%sMethodV" % t, "CallStatic%sMethodA" % t]
          n.append("GetStaticFieldID")
          n += ["GetStatic%sField" % t for t in F]
          n += ["SetStatic%sField" % t for t in F]
          n += ["NewString", "GetStringLength", "GetStringChars", "ReleaseStringChars", "NewStringUTF",
                "GetStringUTFLength", "GetStringUTFChars", "ReleaseStringUTFChars", "GetArrayLength",
                "NewObjectArray", "GetObjectArrayElement", "SetObjectArrayElement"]
          for t in P:
              n.append("New%sArray" % t)
          for t in P:
              n.append("Get%sArrayElements" % t)
          for t in P:
              n.append("Release%sArrayElements" % t)
          for t in P:
              n.append("Get%sArrayRegion" % t)
          for t in P:
              n.append("Set%sArrayRegion" % t)
          n += ["RegisterNatives", "UnregisterNatives", "MonitorEnter", "MonitorExit", "GetJavaVM", "GetStringRegion",
                "GetStringUTFRegion", "GetPrimitiveArrayCritical", "ReleasePrimitiveArrayCritical", "GetStringCritical",
                "ReleaseStringCritical", "NewWeakGlobalRef", "DeleteWeakGlobalRef", "ExceptionCheck",
                "NewDirectByteBuffer", "GetDirectBufferAddress", "GetDirectBufferCapacity", "GetObjectRefType"]
          assert len(n) == 233, len(n)
          chk = {4: "GetVersion", 6: "FindClass", 15: "ExceptionOccurred", 17: "ExceptionClear", 21: "NewGlobalRef",
                 22: "DeleteGlobalRef", 23: "DeleteLocalRef", 25: "NewLocalRef", 31: "GetObjectClass", 33: "GetMethodID",
                 94: "GetFieldID", 113: "GetStaticMethodID", 144: "GetStaticFieldID", 167: "NewStringUTF",
                 168: "GetStringUTFLength", 169: "GetStringUTFChars", 170: "ReleaseStringUTFChars",
                 171: "GetArrayLength", 215: "RegisterNatives", 219: "GetJavaVM", 228: "ExceptionCheck",
                 232: "GetObjectRefType", 61: "CallVoidMethod", 129: "CallStaticIntMethod", 141: "CallStaticVoidMethod"}
          for k, v in chk.items():
              assert n[k] == v, (k, n[k], v)
          o = ["static const char *const jni_names[233] = {"]
          for k in range(233):
              o.append('  "%s",' % n[k])
          o.append("};")
          for k in range(233):
              nm = n[k]
              if "Nonvirtual" in nm and nm.startswith("Call"):
                  o.append("static uint32_t jstub_%d(void *e, void *o, void *c, void *m) { (void)e; (void)o; (void)c; return jcall(%d, m); }" % (k, k))
              elif nm.startswith("Call") or nm.startswith("NewObject") and nm != "NewObjectArray":
                  o.append("static uint32_t jstub_%d(void *e, void *o, void *m) { (void)e; (void)o; return jcall(%d, m); }" % (k, k))
              else:
                  o.append("static uint32_t jstub_%d(void) { return jtrap(%d); }" % (k, k))
          o.append("static void *const jstubs[233] = {")
          o.append("  " + ", ".join("(void *)jstub_%d" % k for k in range(233)))
          o.append("};")
          open("stubs.inc", "w").write("\n".join(o) + "\n")
          print("stubs.inc ok:", len(n), "slot")
          EOF_PY
          cat > src/launcher.tpl <<'EOF_TPL'
          #!/bin/bash
          # Cordy Android loader (Milestone 2). MODE: @MODE@
          # Folder data dicari seperti launcher PortMaster lain: /$directory/ports/<nama>

          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}

          if [ -d "/opt/system/Tools/PortMaster/" ]; then
            controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster/" ]; then
            controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster/" ]; then
            controlfolder="$XDG_DATA_HOME/PortMaster"
          else
            controlfolder="/roms/ports/PortMaster"
          fi

          source $controlfolder/control.txt
          [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"

          GAMEDIR="/$directory/ports/cordy_android"
          [ -d "$GAMEDIR" ] || GAMEDIR="$(cd "$(dirname "$0")" && pwd)/cordy_android"

          cd "$GAMEDIR" || {
            echo "folder cordy_android tidak ketemu: /$directory/ports/cordy_android" > "$(dirname "$0")/loader_error.txt"
            exit 1
          }

          export LD_LIBRARY_PATH="/usr/lib32:/lib32:${LD_LIBRARY_PATH}"
          chmod +x ./cordyloader 2>/dev/null

          if [ ! -f libs/libunity.so ] || [ ! -f libs/libmono.so ] || [ ! -f ./cordyloader ]; then
            echo "libs/libunity.so, libs/libmono.so atau cordyloader belum ada di $GAMEDIR" > loader_stdout.txt
            sleep 3
            exit 1
          fi

          export SDL_GAMECONTROLLERCONFIG="$sdl_controllerconfig"
          rm -f loader_log.txt
          echo "GAMEDIR=$GAMEDIR  mode=@MODE@" > loader_stdout.txt
          for d in /usr/lib32/spa-0.2 /lib32/spa-0.2 /usr/lib/arm-linux-gnueabihf/spa-0.2; do [ -d "$d" ] && export SPA_PLUGIN_DIR="$d" && break; done
          for d in /usr/lib32/pipewire-0.3 /lib32/pipewire-0.3 /usr/lib/arm-linux-gnueabihf/pipewire-0.3; do [ -d "$d" ] && export PIPEWIRE_MODULE_DIR="$d" && break; done
          for d in /usr/lib32/alsa-lib /lib32/alsa-lib /usr/lib/arm-linux-gnueabihf/alsa-lib; do [ -d "$d" ] && export ALSA_PLUGIN_DIR="$d" && break; done
          [ -f cordy.apk ] || echo "PERINGATAN: cordy.apk tidak ada di $GAMEDIR (salin APK Cordy dan namai cordy.apk)" >> loader_stdout.txt
          LOADER_ARGS="$(cat loader.args 2>/dev/null)"
          ./cordyloader libs $LOADER_ARGS @ARG@ >> loader_stdout.txt 2>&1
          echo "exit code: $?" >> loader_stdout.txt
          sleep 2
          type pm_finish >/dev/null 2>&1 && pm_finish
          EOF_TPL
          echo "--stage 2 --timeout 60 --apk cordy.apk" > out/cordy_android/loader.args
          echo "Taruh libunity.so dan libmono.so di folder ini. AMBIL DARI assets/libs/armeabi-v7a/ di dalam APK (6,8 MB dan 3,8 MB), BUKAN dari lib/armeabi-v7a/ (stub proxy). Salin juga APK Cordy ke folder cordy_android dengan nama cordy.apk. Jangan di-upload ke GitHub." > out/cordy_android/libs/TARUH-LIB-DI-SINI.txt

      - name: Buat stub JNI dan skrip peluncur
        run: |
          cd src && python3 gen_stubs.py && cd ..
          sed -e 's/@MODE@/STAGE dari loader.args/' -e 's/@ARG@//' src/launcher.tpl > out/CordyLoader.sh
          sed -e 's/@MODE@/DRY (stage 0)/' -e 's/@ARG@/--dry/' src/launcher.tpl > out/CordyLoader_dry.sh
          bash -n out/CordyLoader.sh
          bash -n out/CordyLoader_dry.sh

      - name: Kompilasi (armhf)
        run: |
          arm-linux-gnueabihf-gcc -O2 -Wall -Wextra -Wno-missing-field-initializers -Isrc -o out/cordy_android/cordyloader src/cordyloader.c -ldl -lpthread -lm
          file out/cordy_android/cordyloader || true
          echo "--- library yang dibutuhkan:"
          arm-linux-gnueabihf-readelf -d out/cordy_android/cordyloader | grep NEEDED
          MAXV=$(arm-linux-gnueabihf-readelf -V out/cordy_android/cordyloader | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "cordyloader butuh GLIBC tertinggi: $MAXV (device: 2.37)"
          if [ "$(printf '%s\n%s\n' 2.37 "$MAXV" | sort -V | tail -1)" != "2.37" ]; then
            echo "GAGAL: cordyloader butuh glibc lebih baru dari 2.37. Simbol penyebab:"
            arm-linux-gnueabihf-nm -D --undefined-only out/cordy_android/cordyloader | grep -E 'GLIBC_2\.(3[89]|[4-9][0-9])'
            exit 1
          fi

      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: cordy-loader-armhf
          path: out
