          /* ======================= shim pthread/sem: objek bionic 4 byte -> simpan pointer ke objek glibc (lazy) ======================= */
          static pthread_mutex_t g_initlock = PTHREAD_MUTEX_INITIALIZER;
          static pthread_mutex_t *mx_get(uint32_t *slot) {
            uint32_t v = *(volatile uint32_t *)slot;
            if (v > 0xFFFFu) return (pthread_mutex_t *)PTR(v);
            pthread_mutex_lock(&g_initlock);
            v = *slot;
            if (v <= 0xFFFFu) {   /* nilai kecil = static initializer bionic: 0 normal, 0x4000 recursive, 0x8000 errorcheck */
              pthread_mutex_t *m = calloc(1, sizeof *m); pthread_mutexattr_t a;
              pthread_mutexattr_init(&a);
              if (v & 0x4000) pthread_mutexattr_settype(&a, PTHREAD_MUTEX_RECURSIVE);
              else if (v & 0x8000) pthread_mutexattr_settype(&a, PTHREAD_MUTEX_ERRORCHECK);
              pthread_mutex_init(m, &a); pthread_mutexattr_destroy(&a);
              *slot = U32(m); v = *slot;
