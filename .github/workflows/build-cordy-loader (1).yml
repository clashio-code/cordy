          static void *b_dlopen(const char *name, int flags) {
            const char *b; (void)flags; dlerr = NULL;
            if (!name) return &g_glob;
            b = strrchr(name, '/'); b = b ? b + 1 : name;
            { int i; for (i = 0; i < nmods; i++) if (!strcmp(b, mods[i].name)) return &mods[i]; }
            if (!strcmp(b, "libc.so")) b = "libc.so.6";
            else if (!strcmp(b, "libm.so")) b = "libm.so.6";
            else if (!strcmp(b, "libdl.so")) b = "libc.so.6";
            else if (!strcmp(b, "libz.so")) b = "libz.so.1";
            else if (!strcmp(b, "libstdc++.so")) b = "libstdc++.so.6";
            { void *h = dlopen(b, RTLD_NOW | RTLD_GLOBAL); if (!h) { dlerr = "tidak ditemukan"; L("[SHIM] dlopen(%s) gagal\n", name); } return h; }
